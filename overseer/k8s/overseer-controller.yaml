apiVersion: apps/v1
kind: Deployment
metadata:
  name: overseer-controller
  namespace: overseer-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overseer-controller
  template:
    metadata:
      labels:
        app: overseer-controller
    spec:
      serviceAccountName: overseer-controller
      containers:
      - name: controller
        image: overseer-controller:latest
        env:
        - name: REPO_SANDBOX_IMAGE
          value: repo-sandbox:latest
        - name: CONFIG_DIR_IMAGE
          value: configdir-cli:latest
        - name: OVERSEER_IMAGE
          value: overseer:latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overseer-controller
  namespace: overseer-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: overseer-controller
rules:
- apiGroups: ["overseer.gemini.google.com"]
  resources: ["overseers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["overseer.gemini.google.com"]
  resources: ["overseers/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: overseer-controller-binding
subjects:
- kind: ServiceAccount
  name: overseer-controller
  namespace: overseer-system
roleRef:
  kind: ClusterRole
  name: overseer-controller
  apiGroup: rbac.authorization.k8s.io
