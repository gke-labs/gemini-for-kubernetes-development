apiVersion: v1
kind: ServiceAccount
metadata:
  name: overseer
  namespace: overseer-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: overseer-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: overseer
rules:
- apiGroups: ["overseer.gemini.google.com"]
  resources: ["overseers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets", "events"]
  verbs: ["get", "list"]
# Delete a pod: a sandbox moved to the overseer's factory image (on reuse,
# no task in flight) has its awake pod replaced, which its controller makes
# again from the updated spec. Without it the spec moved and the old pod
# ran on (factory's sandbox.go repinImage). No more than deleting the
# sandbox itself, which this role already may.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["create"]
# Warm workspaces (factory/design/warm-workspace.md): snapshot the warm
# sandbox's disk, keep the newest, restore new sandboxes from them.
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "list", "create", "delete"]
---
# The cluster-scoped reads an overseer pod needs. The controller binds each
# Overseer's ServiceAccount to this role with its own ClusterRoleBinding
# (overseer-cluster-reader:overseer-<name>). The ClusterRole overseer above is
# bound only per namespace: the overseer pod runs an LLM agent over untrusted
# input and must not hold it cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: overseer-cluster-reader
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: overseer-binding
subjects:
- kind: ServiceAccount
  name: overseer
  namespace: overseer-system
roleRef:
  kind: ClusterRole
  name: overseer
  apiGroup: rbac.authorization.k8s.io
