---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: overseers.overseer.gemini.google.com
spec:
  group: overseer.gemini.google.com
  names:
    kind: Overseer
    listKind: OverseerList
    plural: overseers
    singular: overseer
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              allowlistedUsers:
                items:
                  type: string
                type: array
              chores:
                properties:
                  exclude:
                    items:
                      type: string
                    type: array
                  include:
                    items:
                      type: string
                    type: array
                  mode:
                    default: enabled
                    enum:
                    - enabled
                    - disabled
                    - dryrun
                    type: string
                type: object
              enableGeminiOrchestrator:
                default: false
                type: boolean
              env:
                items:
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
              ephemeralStorage:
                default: 10Gi
                type: string
              geminiAPIKeySecretName:
                type: string
              image:
                type: string
              minNumber:
                format: int32
                type: integer
              pollInterval:
                default: 30m
                type: string
              prInactivityTimeout:
                type: string
              repo:
                properties:
                  issueMode:
                    default: enabled
                    enum:
                    - enabled
                    - disabled
                    - dryrun
                    type: string
                  prMode:
                    default: enabled
                    enum:
                    - enabled
                    - disabled
                    - dryrun
                    type: string
                  reviewMode:
                    default: enabled
                    enum:
                    - enabled
                    - disabled
                    - dryrun
                    type: string
                type: object
              repoURL:
                type: string
              robotAccount:
                type: string
              roles:
                additionalProperties:
                  properties:
                    users:
                      items:
                        type: string
                      type: array
                  type: object
                type: object
              sandboxCPULimit:
                type: string
              sandboxCPURequest:
                type: string
              sandboxEvictionAge:
                default: 7d
                type: string
              sandboxIdleTimeout:
                default: 1h
                type: string
              sandboxMemoryLimit:
                type: string
              sandboxMemoryRequest:
                type: string
              secrets:
                items:
                  properties:
                    mountPath:
                      type: string
                    name:
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
              taskTimeout:
                type: string
              warmWorkspace:
                properties:
                  interval:
                    type: string
                  keep:
                    format: int32
                    minimum: 1
                    type: integer
                  script:
                    type: string
                  scriptPath:
                    maxLength: 256
                    type: string
                    x-kubernetes-validations:
                    - message: scriptPath must be relative, without ..
                      rule: '!self.startsWith(''/'') && !self.split(''/'').exists(p,
                        p == ''..'')'
                  scriptURL:
                    maxLength: 2048
                    pattern: ^https://
                    type: string
                required:
                - interval
                type: object
                x-kubernetes-validations:
                - message: exactly one of script, scriptURL and scriptPath must be
                    set
                  rule: '[has(self.script), has(self.scriptURL), has(self.scriptPath)].filter(x,
                    x).size() == 1'
              workspaceDiskSize:
                default: 10Gi
                type: string
              workspaceStorageClassName:
                type: string
            required:
            - repoURL
            type: object
          status:
            properties:
              message:
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              overseerStatus:
                enum:
                - Active
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
