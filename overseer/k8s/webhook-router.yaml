apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-router
  namespace: overseer-system
  labels:
    app: webhook-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-router
  labels:
    app: webhook-router
rules:
- apiGroups: ["overseer.gemini.google.com"]
  resources: ["overseers"]
  verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-router
  labels:
    app: webhook-router
subjects:
- kind: ServiceAccount
  name: webhook-router
  namespace: overseer-system
roleRef:
  kind: ClusterRole
  name: webhook-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-router
  namespace: overseer-system
  labels:
    app: webhook-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-router
  template:
    metadata:
      labels:
        app: webhook-router
    spec:
      serviceAccountName: webhook-router
      containers:
      - name: webhook-router
        image: ghcr.io/gke-labs/gemini-for-kubernetes-development/factory-golang:latest
        command: ["factory", "gh-webhook-router"]
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: github-app-secrets
              key: webhook-secret
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-router
  namespace: overseer-system
  labels:
    app: webhook-router
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: webhook-router
