apiVersion: overseer.gemini.google.com/v1alpha1
kind: Overseer
metadata:
  name: kcc
spec:
  repoURL: https://github.com/GoogleCloudPlatform/k8s-config-connector
  robotAccount: codebot-robot
  maxActiveReviews: 3
  maxActiveIssues: 3
  chores:
    mode: enabled
    include:
      - KCC Release Scheduler
  geminiAPIKeySecretName: gemini-vscode-tokens
  ephemeralStorage: 10Gi
  image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
  configdirRef: kcc-agents
  repo:
    issueMode: disabled
    prMode: disabled
    reviewMode: disabled

---
apiVersion: configdir.gke.io/v1alpha1
kind: ConfigDir
metadata:
  name: kcc-agents
  namespace: overseer-kcc
spec:
  files:
  - path: .gemini/settings.json
    source:
      inline: |
        {
          "mcpServers": {
          }
        }
  - path: .agents/tf2d-create-identity-ref-issues.yaml
    source:
      inline: |
        ---
        name: Issue for Identity and Reference
        description: For TF/DCL resources to be migrated to Direct, if generate.sh and types.go PR is closed, create an issue for creating identity and reference files.
        schedule: "@daily"
        skipPR: true
        ---
        
        # Role
        You are a software development assistant for the Kubernetes Config Connector project,
        You have access to the following tools:
        - GitHub CLI (`gh`)
        - git
        Use `gh` to perform your duties.

        # Filter Criteria
        This is the criteria to identify the resource Group and Kind that need to be migrated.

        Finding resources that meet the following criteria:
        Look for issues labelled with `area/direct` and `step/gen-types` that are closed recently (e.g., in the last 7 days). These issues indicate that the generate.sh and types.go files have been created for a specific Group and Kind.
        For each of these issues, identify the resource Group and Kind of the resource that has been migrated to Direct.
        
        # Task
        Use gh cli tool to create github issue.
        In a single run create at most one issue to avoid overwhelming the team.
        For a resource Group and Kind identified in the previous step, check if an issue already exists (open or closed) and create a new one if not.
        If an issue already exists for that resource Group and Kind, inject the issue labels if they dont exist.
        If an issue already exists, skip to the next one that meets the criteria and repeat the process.
        The issue should be marked as a subtask of the main epic for the migration effort: https://github.com/GoogleCloudPlatform/k8s-config-connector/issues/5954
        If more than 10 pending issues already exist for this task, do not create new issues to avoid overwhelming the team. Instead, log a message indicating that there are already 10 pending issues and skip creating new ones until some of the existing issues are resolved.
        Created issues should be clear and actionable, providing enough context for developers to understand what needs to be done.
        IMPORTANT:
        * The created issue must be an subtask of the main epic: https://github.com/GoogleCloudPlatform/k8s-config-connector/issues/5954
        * Before creating an issue for a resource, check if an issue already exists (open or closed) to avoid duplicates.
        * The issue title should be in the format: `Create Identity and Reference files for <resource_group> <resource_kind>`
        * Use `gh` tool to create issue.
    
        ## Issue Title

        Title should be: `Create Identity and Reference files for <resource_group> <resource_kind>`,
        where `<resource_group>` and `<resource_kind>` are replaced with the actual resource Group and Kind of the resource identified for migration.

        ## Issue Labels
        The issue should be labeled with the following labels:
        * `overseer` to indicate that the issue was created by Overseer.
        * `area/direct` to indicate that the issue is related to Direct migration.
        * `priority/medium` to indicate the priority level of the issue.
        * `step/identity-reference` to indicate the step in the migration process.

        Use gh tool to create the issue with the appropriate title, labels, and body content as described in the instructions. Make sure to link the issue as a subtask to the main epic for tracking purposes.

        ## Issue Body
        The issue body should contain this text template with the appropriate resource Group and Kind filled in.
        The body template is treated as markdown. So retain the quotes formatting and the code block formatting as is when filling in the Group and Kind.
        Use the <issue_number> placeholder to refer to the issue number of the identified source issue that created the generate.sh and types.go files for this resource.

        ------------ BEGIN ISSUE BODY TEMPLATE ------------
        As part of moving resources from terraform and DCL controllers to direct controllers (Epic #5954), we need to create the Go identity and reference for `${resource_group}${resource_name}`.
        
        Currently, `${resource_group}${resource_name}` is managed by the Terraform or DCL controller. The goal is to create the Go identity and reference in `apis/${resource_group}/v1beta1/` so that we can eventually migrate the controller implementation to the "direct" approach.
        
        ### Instructions
        
        1.  **Add `apis/${resource_group}/v1beta1/${resource_name}_identity.go`**:
            Create a file `apis/${resource_group}/v1beta1/${resource_name}_identity.go`.
            The following are samples of similar identity files.
            - `artifactregistry/v1beta1/artifactregistryrepository_identity.go`
            - `apis/iam/v1beta1/serviceaccountkey_identity.go`
            The correct identity URL formats can be found in the page https://docs.cloud.google.com/asset-inventory/docs/asset-names. Please use that url format in place of "URLKey/{keyValue}". Please break out a separate field for each curly brace delinated '{field}' in the format.
            Please ensure the Identity class implements identity.IdentityV2.
            implement the GetIdentity(ctx context.Context, reader client.Reader) (identity.Identity, error) method on the ${resource_group}${resource_name} resource
        The file likely includes something like the following
        Example:
        ```go
        const (
        	// ${resource_group}${resource_name}IdentityURL is the format for the externalRef of a ${resource_group}${resource_name}.
        	${resource_group}${resource_name}IdentityURL = "URLKey/{keyValue}"
        )
        
        var (
        	_ identity.IdentityV2 = &${resource_group}${resource_name}Identity{}
        	_ identity.Resource   = &${resource_group}${resource_name}{}
        )
        
        var ${resource_group}${resource_name}IdentityFormat = gcpurls.Template[${resource_group}${resource_name}Identity](
        	"${resource_group}.googleapis.com",
        	${resource_group}${resource_name}IdentityURL,
        )
        
        // ${resource_group}${resource_name}Identity represents the identity of a ${resource_group}${resource_name}.
        // +k8s:deepcopy-gen=false
        type ${resource_group}${resource_name}Identity struct {
        	KeyValue string
        }
        ```
        
        2. **Add `apis/${resource_group}/v1beta1/${resource_name}_identity_test.go`**:
            Create a file `apis/${resource_group}/v1beta1/${resource_name}_identity_test.go`.
            It should unit test `apis/${resource_group}/v1beta1/${resource_name}_identity.go`.
            The following are samples of similar identity test files.
            - `artifactregistry/v1beta1/artifactregistryrepository_identity_test.go`
            - `apis/iam/v1beta1/serviceaccountkey_identity_test.go`
        
        3. **Add `apis/${resource_group}/v1beta1/${resource_name}_reference.go`**:
            Create a file `apis/${resource_group}/v1beta1/${resource_name}_reference.go`.
            The following are samples of similar reference files.
            - `artifactregistry/v1beta1/artifactregistryrepository_reference.go`
            - `apis/iam/v1beta1/serviceaccountkey_reference.go`
        Reference URL formats can be looked up from https://docs.cloud.google.com/asset-inventory/docs/asset-names
        Please  implement the full suite of methods like Normalize, ValidateExternal, and ParseExternalToIdentity.
        The file likely includes something like the following
        Example:
        ```go
        var ${resource_group}${resource_name}GVK = schema.GroupVersionKind{
        	Group:   "${resource_group}.cnrm.cloud.google.com",
        	Version: "v1beta1",
        	Kind:    "${resource_group}${resource_name}",
        }
        
        var _ refsv1beta1.Ref = &${resource_group}${resource_name}Ref{}
        
        // ${resource_group}${resource_name}Ref is a reference to a ${resource_group}${resource_name} resource.
        type ${resource_group}${resource_name}Ref struct {
        	// A reference to an externally managed ${resource_group}${resource_name} resource.
        	// Should be in the format "URLKey/{keyValue}".
        	External string `json:"external,omitempty"`
        
        	// The name of a ${resource_group}${resource_name} resource.
        	Name string `json:"name,omitempty"`
        
        	// The namespace of a ${resource_group}${resource_name} resource.
        	Namespace string `json:"namespace,omitempty"`
        }
        
        func init() {
        	refs.Register(&${resource_group}${resource_name}Ref{})
        }
        
        func (r *${resource_group}${resource_name}Ref) GetGVK() schema.GroupVersionKind {
        	return ${resource_group}${resource_name}GVK
        }
        ```
        
        4. **Add `apis/${resource_group}/v1beta1/${resource_name}_reference_test.go`**:
            Create a file `apis/${resource_group}/v1beta1/${resource_name}_reference_test.go`.
            It should unit test `apis/${resource_group}/v1beta1/${resource_name}_reference.go`.
            The following are samples of similar reference test files.
            - `artifactregistry/v1beta1/artifactregistryrepository_reference_test.go`
            - `bigquery/v1beta1/bigquerytable_reference_test.go`
        
        5.  **Copyright Headers**:
            Ensure that new files have the correct copyright header with the current year:
            ```go
            // Copyright 2026 Google LLC
            ```
            Please do *not* change the copyright on existing files.
        
        6. **Validate changes**:
           - Running `make all-binary` and `make test` will ensure the new code compiles and the tests pass. Please fix any issue discovered by this compilation.
        
        This issue is part of Epic #5954.

        This issue is continuation of the #<issue_number> which created the generate.sh and types.go files for this resource. Please refer to that issue for more context on the resource and the migration effort.
        ------------ END ISSUE BODY TEMPLATE ------------
        
                
  - path: .agents/tf2d-generate-sh-types-go-issues-agent.yaml
    source:
      inline: |
        ---
        name: Issue for Generate and Types
        description: Periodically for TF and DCL resources to be migrated to Direct and create issue for creating generate.sh and types.go files.
        schedule: "@daily"
        skipPR: true
        ---
        
        # Role
        You are a software development assistant for the Kubernetes Config Connector project,
        You have access to the following tools:
        - GitHub CLI (`gh`)
        - git
        Use `gh` to perform your duties.

        # Filter Criteria
        This is the criteria to identify the resource Group and Kind that need to be migrated.

        Finding resources that meet the following criteria:
        All resource CRDs are present in `config/crds/resources` directory.
        Candidate resources can be identified by the presence of the label `cnrm.cloud.google.com/dcl2crd: "true"` in their metadata.
        You can use the following command to list all candidate resources:
        ```bash
        for file in `find config/crds/resources -name '*.yaml'`; do echo "$file `yq '.metadata.labels."cnrm.cloud.google.com/dcl2crd"' $file`" | egrep true ; done | sort
        ```
        The resource to be migrated should be in `beta`:
        ```bash 
        yq '.spec.versions[].name' <crd>.yaml
        ```
        And the resource should not have a types.go file generated yet:
        ```bash
        ls -al apis/<GROUP>/v1beta1/*_types.go
        ```

        Identify the Group and Kind of the resources that meet the above criteria and need to be migrated to Direct. 
        
        # Task
        Use gh cli tool to create github issue.
        In a single run create at most one issue to avoid overwhelming the team.
        For a Group and Kind identified in the previous step, check if an issue already exists (open or closed) and create a new one if not.
        If an issue already exists for that Group and Kind, inject the issue labels if they dont exist.
        If an issue already exists, skip to the next one that meets the criteria and repeat the process.
        The issue should be marked as a subtask of the main epic for the migration effort: https://github.com/GoogleCloudPlatform/k8s-config-connector/issues/5954
        If more than 10 pending issues already exist for this task, do not create new issues to avoid overwhelming the team. Instead, log a message indicating that there are already 10 pending issues and skip creating new ones until some of the existing issues are resolved.
        Created issues should be clear and actionable, providing enough context for developers to understand what needs to be done.
        IMPORTANT:
        * The created issue must be an subtask of the main epic: https://github.com/GoogleCloudPlatform/k8s-config-connector/issues/5954
        * Before creating an issue for a resource, check if an issue already exists (open or closed) to avoid duplicates.
        * The issue title should be in the format: `Create generate.sh and types.go files for <Group> <Kind>`
        * Use `gh` tool to create issue.
    
        ## Issue Title

        Title should be: `Create generate.sh and types.go files for <Group> <Kind>`,
        where `<Group>` and `<Kind>` are replaced with the actual Group and Kind of the resource identified for migration.

        ## Issue Labels
        The issue should be labeled with the following labels:
        * `overseer` to indicate that the issue was created by Overseer.
        * `area/direct` to indicate that the issue is related to Direct migration.
        * `priority/medium` to indicate the priority level of the issue.
        * `step/gen-types` to indicate the step in the migration process.

        Use gh tool to create the issue with the appropriate title, labels, and body content as described in the instructions. Make sure to link the issue as a subtask to the main epic for tracking purposes.

        ## Issue Body
        The issue body should contain this text template with the appropriate Group and Kind filled in.
        The body template is treated as markdown. So retain the quotes formatting and the code block formatting as is when filling in the Group and Kind.

        ------------ BEGIN ISSUE BODY TEMPLATE ------------
        As part of moving resources from terraform controllers to direct controllers (Epic #5954), we need to create the Go types for `DataCatalogPolicyTag`.
        
        Currently, `DataCatalogPolicyTag` is managed by the Terraform controller (marked with `tf2crd=true`). The goal is to create the Go types in `apis/datacatalog/v1beta1/` so that we can eventually migrate the controller implementation to the "direct" approach.
        
        ### Instructions
        
        1.  **Create a generate.sh**:
            Create `apis/datacatalog/v1beta1/generate.sh` which includes `DataCatalogPolicyTag`.
            It likely maps to something like `google.cloud.datacatalog.v1`.
            Example:
            ```bash
            go run . generate-types \
              --service google.cloud.datacatalog.v1 \
              --api-version datacatalog.cnrm.cloud.google.com/v1beta1 \
              --resource DataCatalogPolicyTag:PolicyTag \
              --include-skipped-output
        
            go run . generate-mapper \
              --service google.cloud.datacatalog.v1 \
              --api-version datacatalog.cnrm.cloud.google.com/v1beta1 \
              --include-skipped-output
            ```
        
        2.  Set the write permission on the new `apis/datacatalog/v1beta1/generate.sh` file. You should do this by running both `chmod +x apis/datacatalog/v1beta1/generate.sh` and `git add --chmod=+x apis/datacatalog/v1beta1/generate.sh`.
        
        3.  **Generate Scaffolding**:
            Run `apis/datacatalog/v1beta1/generate.sh`. This should create `apis/datacatalog/v1beta1/policytag_types.go`.
        
        4.  **Iterate on Types**:
            Compare the generated CRD with the existing one using `dev/tasks/diff-crds`.
            Modify `apis/datacatalog/v1beta1/policytag_types.go` until the CRD matches the existing one at `config/crds/resources/apiextensions.k8s.io_v1_customresourcedefinition_datacatalogpolicytags.datacatalog.cnrm.cloud.google.com.yaml`.
        
            **Acceptance Criteria:**
            - Running `dev/tasks/diff-crds` should not show differences (or minimal acceptable ones like descriptions).
            - Ensure that running the check_crd_equivalence MCP on the CRD should return EQUIVALENT.
            - Changes to the schema (fields added/removed) are NOT acceptable.
        
        5.  **Copyright Headers**:
            Ensure that new files have the correct copyright header:
            ```go
            // Copyright 2026 Google LLC
            ```
            Please do not change the copyright on existing files.
        
        6.  **Labels**:
            Ensure the controller-runtime annotations match the existing CRD labels, including:
            ```go
            // +kubebuilder:metadata:labels="cnrm.cloud.google.com/managed-by-kcc=true"
            // +kubebuilder:metadata:labels="cnrm.cloud.google.com/system=true"
            // +kubebuilder:metadata:labels="cnrm.cloud.google.com/stability-level=stable"
            // +kubebuilder:metadata:labels="cnrm.cloud.google.com/tf2crd=true"
            ```
            The goal is to maintain these annotations, not add an annotation if it is missing.
        
        7.  **Status**:
            `status.observedGeneration` should be an `*int64`.
        
        8. **Generate Mappers**:
           - Running `dev/tasks/generate-types-and-mappers` will generate the mapper code once the `apis/datacatalog/v1beta1/policytag_types.go` file is generating an equivalent CRD.
           - Run `make all-binary` to ensure the generated mapper code compiles. Please fix any issue discovered by this compilation.
        
        This issue is part of Epic #5954.
        ------------ END ISSUE BODY TEMPLATE ------------
        
                