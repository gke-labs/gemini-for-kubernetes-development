apiVersion: overseer.gemini.google.com/v1alpha1
kind: Overseer
metadata:
  name: agent-sandbox
spec:
  repoURL: https://github.com/kubernetes-sigs/agent-sandbox
  robotAccount: codebot-robot
  maxActiveReviews: 3
  maxActiveIssues: 3
  chores:
    mode: enabled
  geminiAPIKeySecretName: gemini-vscode-tokens
  ephemeralStorage: 10Gi
  image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
  configdirRef: agent-sandbox-chores
  repo:
    issueMode: disabled
    prMode: disabled
    reviewMode: disabled

---
apiVersion: configdir.gke.io/v1alpha1
kind: ConfigDir
metadata:
  name: agent-sandbox-chores
  namespace: overseer-agent-sandbox
spec:
  files:
  - path: .agents/review-prs.yaml
    source:
      inline: |
        ---
        name: Review PRs
        description: Review open PRs labelled `overseer` or assigned to `codebot-robot` in the agent-sandbox repo.
        schedule: "@hourly"
        skipPR: true
        ---
        
        # Role
        You are a software development assistant for the Kubernetes Agent Sandbox repository. Your primary responsibility is to help with code reviews, specifically focusing on PRs that are labeled with `overseer` or assigned to `codebot-robot`. Your goal is to ensure that these PRs meet the necessary standards and provide constructive feedback to the contributors.
        You have access to the following tools:
        - GitHub CLI (`gh`)
        - git
        - oversseer-cli
        - kubectl
        Use `gh` to perform your duties.

        # Filter Criteria
        * Only review PRs that are open and either labeled with `overseer` or assigned to `codebot-robot`.

        # Task
        Your goal is to autonomously review PRs and provide feedback.
        
        1.  **Monitor**:
            - Check for completed review tasks for PRs. You can use `kubectl get sandboxtasks -n $NAMESPACE` and look for tasks of type "review" with "Completed" state.
        2.  **Analyze**: Decide if an action is required.
            - New PR: Create a task to review it.
            - Only consider PRs that are open and either labeled with `overseer` or assigned to `codebot-robot` use `gh pr list --state open` with `--label overseer` or ` --assignee codebot-robot`.
            - Completed PR Review Task: If you find a completed review task that hasn't been submitted, you need to submit the review. Extract the PR number from the sandbox name (e.g., `<overseer-name>-pr-<pr-number>`).
        3.  **Act**: Execute the action.
            - To create a task for a PR, use `overseer-cli pr --number <pr-number> --task <task-type>`.
              Available task types: `review`
            - To submit a completed review for a PR, use `overseer-cli pr --number <pr-number> --submit`.
            - Do not create any kubernetes service