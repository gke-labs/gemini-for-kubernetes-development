# Builds one image the way .github/workflows/build-images.yaml does — the
# repository root as context, VERSION as a build arg — and pushes it to
# Artifact Registry. For when the GitHub runners are not available;
# dev/tools/cloudbuild-deploy submits one of these per image.
#
#   gcloud builds submit <source.tar.gz> --config dev/cloudbuild/image.yaml \
#     --substitutions _REGISTRY=us-central1-docker.pkg.dev/<project>/<repo>,_IMAGE=review-api,_DOCKERFILE=repo-agent/images/review-api/Dockerfile,_TAG=<sha>

substitutions:
  _REGISTRY: ''
  _IMAGE: ''
  _DOCKERFILE: ''
  _TAG: ''

steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --file=${_DOCKERFILE}
      - --build-arg=VERSION=${_TAG}
      - --tag=${_REGISTRY}/${_IMAGE}:${_TAG}
      - --tag=${_REGISTRY}/${_IMAGE}:latest
      - .

images:
  - ${_REGISTRY}/${_IMAGE}:${_TAG}
  - ${_REGISTRY}/${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
