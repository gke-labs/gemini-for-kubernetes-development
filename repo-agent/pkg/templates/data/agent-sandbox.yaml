apiVersion: review.gemini.google.com/v1alpha1
kind: RepoWatch
metadata:
  name: agent-sandbox
spec:
  repoURL: https://github.com/kubernetes-sigs/agent-sandbox
  pollIntervalSeconds: 300
  githubSecretName: github-pat
  dev:
    maxActiveSandboxes: 0
    maxSandboxes: 0
    image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
    llm:
      apiKeySecretRef: gemini-vscode-tokens
  review:
    reviewShutdownAfterMinutes: 30
    image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
    llm:
      configdirRef: agent-sandbox-gemini-config
      apiKeySecretRef: gemini-vscode-tokens
      prompt: >-
        You are an expert kubernetes developer who is helping with code reviews.
        Please look at the most recent commit and provide a review feedback.
        Would you approve it ? Please pay attention to the following: 1. Does
        the fix resolve the original problem. 2. Look for linked issues to
        understand the original problem. 3. Are there tests to check the fix.

        Read @.gemini/user-instructions.json for specific review instructions tuned for this repository.

    maxActiveSandboxes: 3
    maxSandboxes: 5
  issue:
    robotAccount: codebot-robot
    maxActiveSandboxes: 6
    maxSandboxes: 6
    issueShutdownAfterMinutes: 300
    image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
    llm:
        apiKeySecretRef: gemini-vscode-tokens
    models:
    - gemini-3-flash-preview
    - gemini-3.1-pro-preview
    - gemini-3.1-flash-lite-preview
    - gemini-2.5-pro
    - gemini-2.5-flash
    - gemini-2.5-flash-lite
    handlers:
    - name: fix
      taskType: fix-issue
      labels:
        - "repo-agent"
      prompt: |
          Fix this issue
---
apiVersion: configdir.gke.io/v1alpha1
kind: ConfigDir
metadata:
  name: agent-sandbox-gemini-config
spec:
  files:
  - path: .gemini/user-instructions.json
    source:
      inline: |
        ""