apiVersion: review.gemini.google.com/v1alpha1
kind: RepoWatch
metadata:
  name: agent-sandbox
spec:
  repoURL: https://github.com/kubernetes-sigs/agent-sandbox
  pollIntervalSeconds: 300
  githubSecretName: github-pat
  dev:
    maxActiveSandboxes: 1
    maxSandboxes: 3
    image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
    llm:
      apiKeySecretRef: gemini-vscode-tokens
  review:
    reviewShutdownAfterMinutes: 30
    image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
    llm:
      configdirRef: agent-sandbox-gemini-config
      apiKeySecretRef: gemini-vscode-tokens
      prompt: >-
        You are an expert kubernetes developer who is helping with code reviews.
        Please look at the most recent commit and provide a review feedback.
        Would you approve it ? Please pay attention to the following: 1. Does
        the fix resolve the original problem. 2. Look for linked issues to
        understand the original problem. 3. Are there tests to check the fix.

        Read @.gemini/user-instructions.json for specific review instructions tuned for this repository.

    maxActiveSandboxes: 3
    maxSandboxes: 5
  issue:
    maxActiveSandboxes: 1
    maxSandboxes: 3
    issueShutdownAfterMinutes: 30
    image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
    llm:
      apiKeySecretRef: gemini-vscode-tokens
    handlers:
    - prompt: >-
          You are a helpful assistant that triages GitHub issues for a
          Kubernetes-related open source project. Your task is to categorize
          incoming issues based on their content and assign appropriate labels.
          IMPORTANT: Your only task is to categorize the issue. Do NOT attempt
          to fix the issue, write code, or provide solutions. Do NOT verify the
          issue.

          Analyze the issue title and body to determine the most relevant
          category from the following options:
          1. bug: Issues that describe unexpected behavior, errors, or malfunctions in the software.
          2. feature: Suggestions for new features, enhancements, or improvements to existing functionality.
          3. cleanup: Suggestions for cleaning up code, removing deprecated features, or improving code quality.
          4. document: Issues related to documentation errors, omissions, or requests for clarification.
          5. support: Questions or requests for help regarding the use of the software.
          6. other: Any issue that does not fit into the above categories.

          Start the response with "/kind <Category>" where <Category> is one of
          bug , feature , document, support, cleanup or other In the next line,
          provide a concise explanation of your reasoning for the assigned
          category.

          Issue Title: "{{.Title}}" Issue Body: "{{.Body}}" HTML URL:
          "{{.HTMLURL}}"
      name: triage
---
apiVersion: configdir.gke.io/v1alpha1
kind: ConfigDir
metadata:
  name: agent-sandbox-gemini-config
spec:
  files:
  - path: .gemini/user-instructions.json
    source:
      inline: |
        ""