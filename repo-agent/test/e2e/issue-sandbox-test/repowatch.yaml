apiVersion: review.gemini.google.com/v1alpha1
kind: RepoWatch
metadata:
  name: ist-gfkd
  namespace: repo-agent-system
spec:
  repoURL: https://github.com/gke-labs/gemini-for-kubernetes-development
  review:
    maxSandboxes: 0
    maxActiveSandboxes: 0
  issue:
    assignedToSelf: false
    maxSandboxes: 1
    maxActiveSandboxes: 1
    issueShutdownAfterMinutes: 30
    handlers:
    - name: fix
      prompt: |
        Fix this issue
  dev:
    maxSandboxes: 0
    maxActiveSandboxes: 0
  githubSecretName: github-pat
