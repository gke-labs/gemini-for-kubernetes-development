apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  labels:
    review.gemini.google.com/repowatch: ist-gfkd
    sandbox.gemini.google.com/type: issue
  (starts_with(name, 'ist-gfkd-issue-')): true
  namespace: repo-agent-system
  ownerReferences:
  - apiVersion: review.gemini.google.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: RepoWatch
    name: ist-gfkd
spec:
  replicas: 1
  podTemplate:
    spec:
      serviceAccountName: issue-sandbox
      containers:
      - name: sandbox
        (env[?name == 'REPO'] | [0].value): ist-gfkd
