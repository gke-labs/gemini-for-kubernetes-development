apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: issue-sandbox-functionality
spec:
  steps:
  - name: wait-for-repowatch-controller
    try:
    - sleep:
        duration: 10s
    - assert:
        timeout: 3m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: repowatch-controller
            namespace: repo-agent-system
          status:
            readyReplicas: 1
  - name: create-repowatch
    try:
    - apply:
        file: repowatch.yaml
  # Issue-fix tasks are dispatched via the factory CLI: the controller
  # materializes the factory-user identity secret and launches `factory fix`
  # per matched issue; sandboxes are created by factory, not the controller.
  - name: check-factory-user-secret
    try:
    - assert:
        timeout: 2m
        file: factory-user-assert.yaml
    catch:
      - podLogs:
          namespace: repo-agent-system
          selector: statefulset.kubernetes.io/pod-name=repowatch-controller-0
          tail: 200
  - name: check-repowatch
    try:
    - assert:
        timeout: 2m
        file: repowatch-assert.yaml
    catch:
      - describe:
          apiVersion: review.gemini.google.com/v1alpha1
          kind: RepoWatch
          namespace: repo-agent-system
      - podLogs:
          namespace: repo-agent-system
          selector: statefulset.kubernetes.io/pod-name=repowatch-controller-0
          tail: 200
      - events:
          namespace: repo-agent-system
  # The legacy in-controller issue engine must stay retired: no SandboxTask
  # and no controller-owned issue sandbox may appear for this RepoWatch.
  - name: check-no-legacy-issue-resources
    try:
    - error:
        timeout: 30s
        resource:
          apiVersion: custom.agents.x-k8s.io/v1alpha1
          kind: SandboxTask
          metadata:
            namespace: repo-agent-system
            labels:
              review.gemini.google.com/repowatch: ist-gfkd
    - error:
        timeout: 30s
        resource:
          apiVersion: agents.x-k8s.io/v1alpha1
          kind: Sandbox
          metadata:
            namespace: repo-agent-system
            labels:
              sandbox.gemini.google.com/type: issue
              review.gemini.google.com/repowatch: ist-gfkd
