apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: review-sandbox-functionality
spec:
  steps:
  - name: wait-for-repowatch-controller
    try:
    - sleep:
        duration: 10s
    - assert:
        timeout: 3m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: repowatch-controller
            namespace: repo-agent-system
          status:
            readyReplicas: 1
  - name: create-repowatch
    try:
    - apply:
        file: repowatch.yaml
  # PR reviews are dispatched via the factory CLI: the controller launches
  # `factory pr review` per selected PR and tracks it in status under a
  # factory-named (factory-pr-*) sandbox; the controller creates no review
  # sandboxes or SandboxTasks itself.
  - name: check-repowatch
    try:
    - assert:
        timeout: 2m
        file: repowatch-assert.yaml
    catch:
      - describe:
          apiVersion: review.gemini.google.com/v1alpha1
          kind: RepoWatch
          namespace: repo-agent-system
      - podLogs:
          namespace: repo-agent-system
          selector: statefulset.kubernetes.io/pod-name=repowatch-controller-0
          tail: 200
      - events:
          namespace: repo-agent-system
  - name: check-no-legacy-review-resources
    try:
    - error:
        timeout: 30s
        resource:
          apiVersion: custom.agents.x-k8s.io/v1alpha1
          kind: SandboxTask
          metadata:
            namespace: repo-agent-system
            labels:
              review.gemini.google.com/repowatch: rst-gfkd
    - error:
        timeout: 30s
        resource:
          apiVersion: agents.x-k8s.io/v1alpha1
          kind: Sandbox
          metadata:
            namespace: repo-agent-system
            labels:
              sandbox.gemini.google.com/type: review
              review.gemini.google.com/repowatch: rst-gfkd
