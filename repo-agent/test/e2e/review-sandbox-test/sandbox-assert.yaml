apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  labels:
    review.gemini.google.com/repowatch: rst-gfkd
  (starts_with(name, 'rst-gfkd-pr-')): true
  namespace: repo-agent-system
  ownerReferences:
  - apiVersion: review.gemini.google.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: RepoWatch
    name: rst-gfkd
spec:
  replicas: 1
  podTemplate:
    metadata:
      labels:
        (starts_with(sandbox, 'rst-gfkd-pr-')): true
    spec:
      serviceAccountName: review-sandbox
      initContainers:
      - name: inject-agent
      containers:
      - name: sandbox
        resources:
          limits:
            ephemeral-storage: 6Gi
