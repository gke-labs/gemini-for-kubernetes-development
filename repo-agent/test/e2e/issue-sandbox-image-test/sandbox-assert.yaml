apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  labels:
    review.gemini.google.com/repowatch: ist-image
    sandbox.gemini.google.com/type: issue
  (starts_with(name, 'ist-image-issue-')): true
  namespace: repo-agent-system
  ownerReferences:
  - apiVersion: review.gemini.google.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: RepoWatch
    name: ist-image
spec:
  replicas: 1
  podTemplate:
    spec:
      serviceAccountName: issue-sandbox
