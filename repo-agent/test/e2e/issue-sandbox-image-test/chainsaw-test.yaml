apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: issuesandbox-with-image
spec:
  steps:
  - name: wait-for-repowatch-controller
    try:
    - sleep:
        duration: 10s
    - assert:
        timeout: 3m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: repowatch-controller
            namespace: repo-agent-system
          status:
            readyReplicas: 1
  - name: create-repowatch
    try:
    - apply:
        file: repowatch.yaml
  - name: check-repowatch
    try:
    - assert:
        timeout: 1m
        file: repowatch-assert.yaml
    catch:
      - describe:
          apiVersion: review.gemini.google.com/v1alpha1
          kind: RepoWatch
          namespace: repo-agent-system
      - podLogs:
          namespace: repo-agent-system
          selector: statefulset.kubernetes.io/pod-name=repowatch-controller-0
          tail: 200
      - events:
          namespace: repo-agent-system
  - name: check-issuesandbox
    try:
    - assert:
        timeout: 20m
        file: sandbox-assert.yaml
    catch:
    - describe:
        apiVersion: agents.x-k8s.io/v1alpha1
        kind: Sandbox
        namespace: repo-agent-system
        selector: review.gemini.google.com/repowatch=ist-image
    - script:
        content: |
          SANDBOX_NAME=$(kubectl get sandbox -n repo-agent-system -l review.gemini.google.com/repowatch=ist-image -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$SANDBOX_NAME" ]; then
            echo "No Sandbox found via label selector!"
            exit 0
          fi
          echo "Found Sandbox: $SANDBOX_NAME"
          
          # Find pod by sandbox label
          POD_NAME=$(kubectl get pod -n repo-agent-system -l sandbox=$SANDBOX_NAME -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$POD_NAME" ]; then
             echo "Pod not found for sandbox $SANDBOX_NAME"
             POD_NAME="$SANDBOX_NAME"
          fi

          echo "Looking for Pod: $POD_NAME"
          echo "--- Describing Sandbox $SANDBOX_NAME ---"
          kubectl describe sandbox -n repo-agent-system "$SANDBOX_NAME" || echo "Sandbox not found yet"
          echo "--- Describing Pod $POD_NAME ---"
          kubectl describe pod -n repo-agent-system "$POD_NAME" || echo "Pod not found yet"
          echo "--- Logs for Pod $POD_NAME (container: sandbox) ---"
          kubectl logs -n repo-agent-system "$POD_NAME" -c sandbox || echo "Could not fetch logs"
  - name: check-sandboxtask
    try:
    - assert:
        timeout: 20m
        file: sandboxtask-assert.yaml
    catch:
    - describe:
        apiVersion: custom.agents.x-k8s.io/v1alpha1
        kind: SandboxTask
        namespace: repo-agent-system
        selector: review.gemini.google.com/repowatch=ist-image
