apiVersion: custom.agents.x-k8s.io/v1alpha1
kind: IssueSandbox
metadata:
  annotations:
    agentDraft: |
      /kind feature
      This issue is a feature request to add AGI to the project.
  finalizers:
  - kro.run/finalizer
  labels:
    review.gemini.google.com/repowatch: ist-image
    review.gemini.google.com/handler: triage
  (starts_with(name, 'ist-image-issue-')): true
  namespace: repo-agent-system
  ownerReferences:
  - apiVersion: review.gemini.google.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: RepoWatch
    name: ist-image
spec:
  destination:
    pushEnabled: false
  devcontainerConfigRef: devcontainer-json
  gateway:
    httpEnabled: true
    ref: repo-agent-gateway
  githubSecretName: github-pat
  llm:
    apiKeySecretName: dummy-provider-token
    configdirRef: ""
  llmBackend:
    name: dummy
  networkPolicy:
    enabled: false
  replicas: 1
  resources:
    ephemeralStorage: 6Gi
  serviceAccountName: issue-sandbox
  source:
    repo: ist-image
    handler: triage
status:
  (fqdn != null && starts_with(fqdn, 'devc-ist-image-issue-')): true
  (sandboxConditions[?type == 'Ready']):
    - reason: DependenciesReady
      status: "True"
