apiVersion: review.gemini.google.com/v1alpha1
kind: RepoWatch
metadata:
  name: ist-image
  namespace: repo-agent-system
spec:
  repoURL: https://github.com/gke-labs/gemini-for-kubernetes-development
  review:
    maxSandboxes: 0
    maxActiveSandboxes: 0
  issue:
    assignedToSelf: false
    maxSandboxes: 1
    maxActiveSandboxes: 1
    issueShutdownAfterMinutes: 30
    image: ghcr.io/gke-labs/gemini-for-kubernetes-development/generic-golang:latest
    llm:
      apiKeySecretRef: dummy-provider-token
      provider: dummy
    handlers:
    - name: triage
      taskType: triage-issue
      prompt: |
        Triage this issue
  dev:
    maxSandboxes: 0
    maxActiveSandboxes: 0
  githubSecretName: github-pat