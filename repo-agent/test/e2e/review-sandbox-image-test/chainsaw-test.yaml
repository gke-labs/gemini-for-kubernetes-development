apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reviewsandbox-with-image
spec:
  steps:
  - name: wait-for-repowatch-controller
    try:
    - sleep:
        duration: 10s
    - assert:
        timeout: 3m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: repowatch-controller
            namespace: repo-agent-system
          status:
            readyReplicas: 1
  - name: create-repowatch
    try:
    - apply:
        file: repowatch.yaml
  - name: check-repowatch
    try:
    - assert:
        timeout: 1m
        file: repowatch-assert.yaml
    catch:
      - describe:
          apiVersion: review.gemini.google.com/v1alpha1
          kind: RepoWatch
          namespace: repo-agent-system
      - podLogs:
          namespace: repo-agent-system
          selector: statefulset.kubernetes.io/pod-name=repowatch-controller-0
      - events:
          namespace: repo-agent-system
  - name: check-reviewsandbox
    try:
    - assert:
        timeout: 20m
        file: reviewsandbox-assert.yaml
    catch:
    # 1. Describe the ReviewSandbox to see why it might be stuck (Status/Events)
    - describe:
        apiVersion: custom.agents.x-k8s.io/v1alpha1
        kind: ReviewSandbox
        namespace: repo-agent-system
        selector: review.gemini.google.com/repowatch=rst-image
    # 2. Run a script to dynamically find the Pod and get its logs
    - script:
        content: |
          # 1. Find the ReviewSandbox name using the common label
          # We use jsonpath to extract just the name string (e.g., "rst-image-pr-209")
          RS_NAME=$(kubectl get reviewsandbox -n repo-agent-system -l review.gemini.google.com/repowatch=rst-image -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$RS_NAME" ]; then
            echo "No ReviewSandbox found via label selector!"
            exit 0
          fi
          echo "Found ReviewSandbox: $RS_NAME"
          # 2. Construct the Pod name based on your convention (devc-<name>)
          POD_NAME="devc-$RS_NAME"
          SANDBOX_NAME="devc-$RS_NAME"
          echo "Looking for Pod: $POD_NAME"
          # 3. Describe the Sandbox and pod first
          echo "--- Describing Sandbox $SANDBOX_NAME ---"
          kubectl describe sandbox -n repo-agent-system "$SANDBOX_NAME" || echo "Sandbox not found yet"
          echo "--- Describing Pod $POD_NAME ---"
          kubectl describe pod -n repo-agent-system "$POD_NAME" || echo "Pod not found yet"
          # 4. Fetch the logs
          echo "--- Logs for Pod $POD_NAME (container: review-sandbox) ---"
          kubectl logs -n repo-agent-system "$POD_NAME" -c review-sandbox || echo "Could not fetch logs (pod might not be running)"
  - name: check-sandboxtask
    try:
    - assert:
        timeout: 20m
        file: sandboxtask-assert.yaml
    catch:
    - describe:
        apiVersion: custom.agents.x-k8s.io/v1alpha1
        kind: SandboxTask
        namespace: repo-agent-system
        selector: review.gemini.google.com/repowatch=rst-image
    - script:
        content: |
          RS_NAME=$(kubectl get reviewsandbox -n repo-agent-system -l review.gemini.google.com/repowatch=rst-image -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$RS_NAME" ]; then
            POD_NAME="devc-$RS_NAME"
            echo "--- Logs for Pod $POD_NAME (container: review-sandbox) ---"
            kubectl logs -n repo-agent-system "$POD_NAME" -c review-sandbox || echo "Could not fetch logs"
          fi
  #- name: delete-repowatch
  #  try:
  #  - delete:
  #      file: repowatch.yaml
