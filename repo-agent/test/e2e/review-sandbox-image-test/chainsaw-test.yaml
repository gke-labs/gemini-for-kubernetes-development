apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reviewsandbox-with-image
spec:
  steps:
  - name: wait-for-repowatch-controller
    try:
    - sleep:
        duration: 10s
    - assert:
        timeout: 3m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: repowatch-controller
            namespace: repo-agent-system
          status:
            readyReplicas: 1
  - name: create-repowatch
    try:
    - apply:
        file: repowatch.yaml
  - name: check-repowatch
    try:
    - assert:
        timeout: 1m
        file: repowatch-assert.yaml
    catch:
      - describe:
          apiVersion: review.gemini.google.com/v1alpha1
          kind: RepoWatch
          namespace: repo-agent-system
      - podLogs:
          namespace: repo-agent-system
          selector: statefulset.kubernetes.io/pod-name=repowatch-controller-0
          tail: 200
      - events:
          namespace: repo-agent-system
  - name: check-reviewsandbox
    try:
    - assert:
        timeout: 20m
        file: sandbox-assert.yaml
    catch:
    # 1. Describe the Sandbox to see why it might be stuck (Status/Events)
    - describe:
        apiVersion: agents.x-k8s.io/v1alpha1
        kind: Sandbox
        namespace: repo-agent-system
        selector: review.gemini.google.com/repowatch=rst-image
    # 2. Run a script to dynamically find the Pod and get its logs
    - script:
        content: |
          # 1. Find the Sandbox name using the common label
          RS_NAME=$(kubectl get sandbox -n repo-agent-system -l review.gemini.google.com/repowatch=rst-image -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$RS_NAME" ]; then
            echo "No Sandbox found via label selector!"
            exit 0
          fi
          echo "Found Sandbox: $RS_NAME"
          # 2. Find the Pod using the label selector
          POD_LABEL="sandbox=$RS_NAME"
          echo "Looking for Pod with label: $POD_LABEL"
          POD_NAME=$(kubectl get pod -n repo-agent-system -l "$POD_LABEL" -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$POD_NAME" ]; then
             echo "Pod not found yet"
          else
             echo "Found Pod: $POD_NAME"
             echo "--- Describing Pod $POD_NAME ---"
             kubectl describe pod -n repo-agent-system "$POD_NAME"
             # 4. Fetch the logs
             echo "--- Logs for Pod $POD_NAME (container: sandbox) ---"
             kubectl logs -n repo-agent-system "$POD_NAME" -c sandbox || echo "Could not fetch logs (pod might not be running)"
          fi
  - name: check-sandboxtask
    try:
    - assert:
        timeout: 20m
        file: sandboxtask-assert.yaml
    catch:
    - describe:
        apiVersion: custom.agents.x-k8s.io/v1alpha1
        kind: SandboxTask
        namespace: repo-agent-system
        selector: review.gemini.google.com/repowatch=rst-image
    - script:
        content: |
          RS_NAME=$(kubectl get sandbox -n repo-agent-system -l review.gemini.google.com/repowatch=rst-image -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$RS_NAME" ]; then
            POD_LABEL="sandbox=$RS_NAME"
            POD_NAME=$(kubectl get pod -n repo-agent-system -l "$POD_LABEL" -o jsonpath='{.items[0].metadata.name}')
            if [ -n "$POD_NAME" ]; then
              echo "--- Logs for Pod $POD_NAME (container: sandbox) ---"
              kubectl logs -n repo-agent-system "$POD_NAME" -c sandbox || echo "Could not fetch logs"
            fi
          fi
  #- name: delete-repowatch
  #  try:
  #  - delete:
  #      file: repowatch.yaml
