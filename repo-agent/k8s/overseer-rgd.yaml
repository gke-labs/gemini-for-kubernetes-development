apiVersion: kro.run/v1alpha1
kind: ResourceGroupDefinition
metadata:
  name: overseer
spec:
  schema:
    apiVersion: v1alpha1
    kind: Overseer
    spec:
      repoUrl: string
      githubSecretName: string
      image: string
      apiKeySecretName: string
  resources:
    - id: sa
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: overseer-sa
    - id: role
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: overseer-role
        rules:
          - apiGroups: ["custom.agents.x-k8s.io"]
            resources: ["issuesandboxes", "reviewsandboxes", "sandboxtasks"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
          - apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list"]
    - id: rolebinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: overseer-rb
        subjects:
          - kind: ServiceAccount
            name: overseer-sa
        roleRef:
          kind: Role
          name: overseer-role
          apiGroup: rbac.authorization.k8s.io
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: overseer
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: overseer
          template:
            metadata:
              labels:
                app: overseer
            spec:
              serviceAccountName: overseer-sa
              containers:
                - name: overseer
                  image: ${schema.spec.image}
                  env:
                    - name: REPO_URL
                      value: ${schema.spec.repoUrl}
                    - name: GITHUB_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: ${schema.spec.githubSecretName}
                          key: pat
                    - name: GEMINI_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${schema.spec.apiKeySecretName}
                          key: apiKey
