apiVersion: v1
kind: ServiceAccount
metadata:
  name: pr-review-api
  namespace: repo-agent-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pr-review-api-role
rules:
# Can manage sandboxes in all user namespaces
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "delete", "patch", "update", "create"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "delete", "patch", "update", "create"]
# Can read boards
- apiGroups: ["board.gemini.google.com"]
  resources: ["repoboards"]
  verbs: ["get", "list", "create", "delete", "update", "patch"]
# Can file a click and read back what became of it. No update and no
# delete: the phase is the controller's to write and the controller's to
# collect, so a second click cannot rewrite the first one's outcome.
- apiGroups: ["board.gemini.google.com"]
  resources: ["requests"]
  verbs: ["get", "list", "create"]
# Can manage overseers
- apiGroups: ["overseer.gemini.google.com"]
  resources: ["overseers"]
  verbs: ["get", "list", "create", "delete", "update", "patch"]
# Can get the specific secrets/configmaps it needs to copy, and create/update new ones.
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "create", "update"]
# Can list pods to find sandboxes, exec into them for terminal, and
# port-forward to the factory daemon's agent sessions (research)
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "pods/portforward"]
  verbs: ["get", "list", "create"]
# Can proxy to nodes for exec
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy"]
  verbs: ["get", "list", "create", "update"]
# Can check for namespaces and create them if missing
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "create"]
# Can setup service accounts in user namespace
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "create"]
# Can setup rolebindings in user namespace
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["get", "create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pr-review-api-binding
subjects:
- kind: ServiceAccount
  name: pr-review-api
  namespace: repo-agent-system
roleRef:
  kind: ClusterRole
  name: pr-review-api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pr-review-api-bind-configdir-controller
subjects:
- kind: ServiceAccount
  name: pr-review-api
  namespace: repo-agent-system
roleRef:
  kind: ClusterRole
  name: configdir-controller
  apiGroup: rbac.authorization.k8s.io

