---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: requests.board.gemini.google.com
spec:
  group: board.gemini.google.com
  names:
    kind: Request
    listKind: RequestList
    plural: requests
    shortNames:
    - req
    singular: request
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.verb
      name: Verb
      type: string
    - jsonPath: .metadata.annotations.board\.gemini\.google\.com/subject
      name: Subject
      type: string
    - jsonPath: .spec.member
      name: Member
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              apply:
                properties:
                  action:
                    enum:
                    - label
                    - comment
                    type: string
                  kind:
