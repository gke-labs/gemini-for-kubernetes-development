                    - Triage
                    - Plan
                    type: string
                required:
                - action
                - kind
                type: object
              board:
                type: string
              instruction:
                type: string
              member:
                type: string
              number:
                type: integer
              research:
                properties:
                  kind:
                    type: string
                  sessionId:
                    type: string
                  since:
                    type: string
                  title:
                    type: string
                  topic:
                    type: string
                required:
                - sessionId
                type: object
              revise:
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                type: string
              run:
                properties:
                  intent:
                    type: string
                  mode:
                    enum:
                    - plan
                    - deploy
                    - run
                    - teardown
                    type: string
                  name:
                    type: string
                  runbook:
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  scenario:
                    type: string
                  target:
                    minimum: 1
                    type: integer
                required:
                - mode
                - name
                type: object
              verb:
                enum:
                - fix
                - review
                - triage
                - plan
                - iterate
                - address
                - investigate
                - run
                - research
                - apply
                - revise
