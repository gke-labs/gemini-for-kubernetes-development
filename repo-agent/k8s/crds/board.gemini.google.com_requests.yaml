            required:
            - board
            - member
            - verb
            type: object
          status:
            properties:
              completedAt:
                format: date-time
                type: string
              launchedAt:
                format: date-time
                type: string
              message:
                type: string
              phase:
                enum:
                - Pending
                - Launching
                - Running
                - Succeeded
                - Failed
                type: string
              reason:
                type: string
              sandbox:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
