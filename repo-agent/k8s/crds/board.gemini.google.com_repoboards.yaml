---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: repoboards.board.gemini.google.com
spec:
  group: board.gemini.google.com
  names:
    kind: RepoBoard
    listKind: RepoBoardList
    plural: repoboards
    singular: repoboard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repoURL
      name: Repo
      type: string
    - jsonPath: .status.counts.active
      name: Active
      type: integer
    - jsonPath: .status.counts.needsHuman
      name: NeedsHuman
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              auto:
                properties:
                  excludeLabels:
                    items:
                      type: string
                    type: array
                  fix:
                    default: "off"
                    enum:
                    - "off"
                    - assigned
                    type: string
                  labels:
                    items:
                      type: string
                    type: array
                  recencyDays:
                    default: 7
                    minimum: 1
                    type: integer
                  review:
                    default: "off"
                    enum:
                    - "off"
                    - requested
                    - all
                    type: string
                  triage:
                    default: "off"
                    enum:
                    - "off"
                    - unclaimed
                    - all
                    type: string
                type: object
              limits:
                properties:
                  maxActive:
                    default: 5
                    type: integer
                type: object
              policy:
                properties:
                  autoIterate:
                    default: true
                    type: boolean
                  disclose:
                    default: false
                    type: boolean
                  draftPR:
                    default: true
                    type: boolean
                type: object
              ready:
                properties:
                  approvals:
                    default: 1
                    type: integer
                  requiredChecks:
                    default: true
                    type: boolean
                type: object
              repoURL:
                type: string
                x-kubernetes-validations:
                - message: repoURL is immutable
