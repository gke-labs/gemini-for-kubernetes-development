apiVersion: v1
kind: ServiceAccount
metadata:
  name: syncer
  namespace: repo-agent-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: syncer-role
rules:
- apiGroups: ["syncer.gemini.google.com"]
  resources: ["syncers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["syncer.gemini.google.com"]
  resources: ["syncers/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["syncer.gemini.google.com"]
  resources: ["syncer/finalizers"]
  verbs: ["update"]
# Access to any resource it might sync
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: syncer-binding
subjects:
- kind: ServiceAccount
  name: syncer
  namespace: repo-agent-system
roleRef:
  kind: ClusterRole
  name: syncer-role
  apiGroup: rbac.authorization.k8s.io
