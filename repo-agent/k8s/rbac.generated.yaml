---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: repo-agent-controller
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - board.gemini.google.com
  resources:
  - repoboards
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - board.gemini.google.com
  resources:
  - repoboards/status
  verbs:
  - get
  - patch
  - update
