# Mirrors prs/handlers.go handlePRReview, gated by prs/labels.go
# shouldAutoReviewPR and isPRApprovedOrLGTM: a green PR with no pending
# trusted feedback, not approved, whose head the automated reviewer has
# not reviewed, and that wants a review - */review on itself, or, while
# it is not ready-for-human, on an issue it closes - is reviewed and the
# review submitted (review --apply --action submit-review,
# its run: below), once per head. Fourth of the PR rules that take the
# item (prs/scanner.go evaluate). The review instructions are the overseer's,
# passed by the engine.
name: review
description: Review a green PR that wants a review
on: pr
order: 40
when:
  author: pool
  checks: green
  feedback: none
  approved: false
  reviewed-at-head: false
  any-of:
    - labels: {all: ["*/review"]}
    - labels: {none: ["*/ready-for-human"]}
      closes: {labels: {all: ["*/review"]}}
run:
  recipe: review
  apply: submit-review
  inputs:
    instructions: "{{review-instructions}}"
  on-start:
    comment: "AI Factory started reviewing this pull request in a sandbox."
policy:
  dedupe: head
  # A review that fails (it could not load its instructions, the engine
  # errored) is not a review of the head, so dedupe does not hold it back:
  # without a cooldown it ran again every scan (KCC #15826: 40+ runs, 3s
  # each, over 7h). It waits 30m after a failure instead; a new head ends
  # the wait, so a push is still reviewed at once.
  cooldown:
    failure: 30m
    reset-on: [head]
  # A review that keeps failing at one head cannot run at all (its
  # instructions, its sandbox): after 3 failed runs it gives up, with the
  # stop label and a comment, for a person to look. A new head, or taking
  # the stop label off, starts the count again.
  give-up:
    attempts: 3
    since: [head, pause]
    failed: true
    comment: Pausing after 3 failed reviews at this head. The review could not run (see its task logs); fix what it trips on, then take the stop label off.
  phase: 1
