# This repository's own rule (not one of factory's): triage an issue
# someone outside the project opened (author: external - not the pool, the
# owner, an organization member, a collaborator, or a login the overseer
# trusts), when a maintainer labels it overseer/triage. The triage recipe
# suggests labels, a priority and duplicates with an assessment, and the
# comment apply posts them on the issue: a maintainer applies the labels.
# The label is in the overseer's own namespace, so the watch lists issues
# by it; the issue does not get the trigger label (that would point fix at
# it too).
#
# A triage that succeeds leaves {{trigger}}/triaged on the issue (on-success,
# the watcher's write); the suggested labels themselves are a maintainer's
# to apply.
#
# The label is a command: the watcher takes it off when the task ends,
# whatever happened (on-end), so each label is one try - apply it again to
# triage again.
name: triage
description: Triage an outside author's issue labelled overseer/triage, posting the triage as a comment
on: issue
order: 15
when:
  author: external
  labels: {any: ["{{trigger}}/triage"]}
run:
  recipe: triage
  apply: comment
  on-success:
    label: ["{{trigger}}/triaged"]   # done: the watcher's own write
  on-failure:
    comment: "Triaging this issue failed; apply the triage label again to retry."
  on-end:
    unlabel: ["{{trigger}}/triage"]
