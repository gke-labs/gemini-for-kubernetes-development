# Mirrors issues/scanner.go queueTask and stopForUnavailableWorkflow: an
# issue whose body names a workflow definition that cannot be loaded -
# missing, or not a workflow it can run - would only fail, and fail again
# after every cooldown, with nothing on the issue to say so. It is stopped
# instead, with a comment saying which definition and why: the comment
# below, then the definition's path and load error, which the scanner adds
# (issues/scanner.go unavailableWorkflowComment). Before workflow: the stop ends the walk, so neither workflow nor
# fix runs. A definition that cannot be fetched at all (an API error) is
# not missing: the scanner looks again next cycle (a gate, not a rule).
name: workflow-missing
description: Stop an issue whose workflow definition cannot be loaded
on: issue
order: 5
when:
  # pointed at: the trigger label, a pool assignee, or opened by the
  # watcher (the issue listings'; the engine's own, so a decision outside
  # a scan - the dispatcher's at start - holds the same)
  any-of:
    - labels: {any: ["{{trigger}}"]}
    - assignee: pool
    - opened-by: watcher
  fanout: false
  workflow: missing
run:
  stop:
    comment: This issue names a workflow definition that cannot be loaded, so no workflow run was started.
