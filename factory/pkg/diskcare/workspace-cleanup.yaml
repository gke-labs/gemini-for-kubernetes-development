# workspace-cleanup: makes room on a sandbox's workspace disk. Factory runs
# it before a task when the workspace has less than 10 GB free (and the
# overseer may run it on idle sandboxes). This built-in one deletes
# nothing - what is safe to delete depends on the repository's toolchain -
# and only reports. A repository puts its own at
# .agents/maintenance/workspace-cleanup.yaml.
#
# It is a recipe like any other, run by factory's recipe runner: run: and
# uses: steps (no ask: - no agent runs it), if:, continue-on-error, with
# its inputs as INPUT_WORKSPACE, INPUT_FREE_BYTES and INPUT_TARGET_BYTES,
# the sandbox's environment (TMPDIR, GOCACHE, ...), and TASK_DIR for its
# step logs. A step that fails stops it, as in any recipe
# (continue-on-error: true lets the next one run); the task then starts if
# there is room enough.
name: workspace-cleanup
inputs:
  workspace:
    description: the workspace's mount (/workspaces)
  free_bytes:
    description: free space on the workspace now, in bytes
  target_bytes:
    description: free space wanted, in bytes
start:
  steps:
    - run: |
        df -h "$INPUT_WORKSPACE" | awk 'NR==2 {print "Workspace: " $3 " used of " $2 ", " $4 " free"}' || true
        echo "No cleanup is configured for this repository (.agents/maintenance/workspace-cleanup.yaml): nothing deleted."
