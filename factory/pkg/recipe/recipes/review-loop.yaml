# factory recipe review-loop --url <PR>: reviews a pull request of yours
# and fixes what the review finds, up to three rounds, in one task - the
# review and the fix go back and forth in the sandbox, not through GitHub.
# Each round, a reviewer that has not seen the work (a step session of its
# own, fresh, with no way to GitHub: design/task-recipes-and-outputs.md)
# reviews the PR's change and writes its findings; if it found something,
# the agent that looks after the PR (session care, as care-comments) fixes
# it or says why not, and the push step pushes, so CI runs on that head
# while the next round reviews it. It stops at the first clean review, or
# after the third round's fix. Nothing is posted: the reviews are files of
# the task (review-1.yaml…), and the PR's automated review, the review
# rule's, still reviews the head it leaves - which it should now pass the
# first time (design/review-loop.md, phase 1).
#
# The PR must be yours (on: [my-pr]), as for care-comments: it runs in the
# PR's fix sandbox, takes the PR as it is now (INPUT_PUSHED_*), and pushes
# to its branch on your fork leased against the head it had - after each
# round, against the head the round before pushed.
name: review-loop
label: Review and fix
on: [my-pr]
as: author
session: care

inputs:
  instructions:
    type: instructions
    description: Review instructions or guidelines the reviewer must follow

context: |
  You are an automated coding agent. You look after a pull request: you
  keep it mergeable, and answer its reviewers. A human maintainer reviews
  your commits.

  Commit messages name no agent: no `Co-authored-by` (or other) trailer for
  yourself or any AI. The commits are already the member's; whether an agent
  wrote the change is for the pull request description to say.

  You commit, and that is all you write. Do NOT run `git push`, do NOT
  open, edit or comment on pull requests or issues, and do NOT add labels:
  when you are done, factory pushes your commits to the pull request's
  branch on the member's fork.

  The repository is checked out in the current directory, on the pull
  request's branch. The git remote "origin" is the member's fork,
  "upstream" the repository. `gh` is authenticated, to read issues and
  pull requests. Do not run `git config --global`: in this environment it
  overwrites /dev/null and breaks git for the rest of the run.

start:
  steps:
    - uses: setup-git
    - uses: setup-fork
    - run: sleep 5 # lib.sh's HACK: avoid git lock issues
    - uses: configure-engine
    # The branch to push and the head to lease against: a commit someone
    # else pushed to the PR since is never overwritten.
    - run: |
        test -n "${INPUT_PUSHED_BRANCH}" && test -n "${INPUT_PUSHED_HEAD}" || { echo "nothing pushed to this PR is known; there is no branch to work on" >&2; exit 1; }
        printf '%s\n' "${INPUT_PUSHED_BRANCH}" > "$TASK_DIR/branch"
        printf '%s\n' "${INPUT_PUSHED_BASE}" > "$TASK_DIR/base"
        printf '%s' "${INPUT_PUSHED_HEAD}" > "$TASK_DIR/lease"
        printf '%s' "${INPUT_PR_URL##*/}" > "$TASK_DIR/pr"
        if [ "$(git symbolic-ref --short -q HEAD)" != "${INPUT_PUSHED_BRANCH}" ]; then
          git rev-parse -q --verify "refs/heads/${INPUT_PUSHED_BRANCH}" >/dev/null ||
            git fetch origin "refs/heads/${INPUT_PUSHED_BRANCH}:refs/heads/${INPUT_PUSHED_BRANCH}"
          git checkout "${INPUT_PUSHED_BRANCH}"
        fi
    # The PR as it is now.
    - run: |
        git fetch origin "refs/heads/${INPUT_PUSHED_BRANCH}"
        git reset --hard "${INPUT_PUSHED_HEAD}"

    # ── Round 1 ────────────────────────────────────────────────────────
    - ask: &review |
        You are reviewing a pull request. You did not write it, and you
        must not change anything: do NOT modify or create files in the
        repository (the findings file you are asked for is outside it), and
        do NOT run git write operations. You have no GitHub credentials.

        The pull request: https://github.com/{{ .Inputs.repo_owner }}/{{ .Inputs.repo_name }}/pull/{{ file "pr" }}
        "{{ .Inputs.pr_title }}"
        <pr_body>
        {{ .Inputs.pr_body }}
        </pr_body>

        It is checked out in the current directory. Its change is
        `git diff {{ file "base" }}...HEAD`; see it per file, read the code
        around it, its callers and its tests. Look for bugs, regressions,
        missing edge cases, missing tests, and anything the review
        instructions require. Skip generated files (zz_generated*, *.pb.go,
        anything marked "Code generated by").
        {{- with .Inputs.instructions }}

        Review instructions you MUST follow:
        <instructions>
        {{ . }}
        </instructions>
        {{- end }}
      session: review-1
    - ask: |
        Now write your findings to the file {{ output "review-1.yaml" }}, as
        YAML in EXACTLY this structure, with nothing else in the file:

        verdict: changes   # or: clean, when nothing needs to change
        findings:
          - path: pkg/foo/bar.go      # a file of the change
            line: 42                  # optional
            problem: What is wrong, and why it matters.
            fix: What to change.

        Only what must change belongs here: no praise, no style nits the
        instructions do not ask for. With nothing to change, write
        `verdict: clean` and `findings: []`. Write the whole file with your
        file tool (if it refuses the path, with the shell), then say in a
        line that it is written.
      session: review-1
      expects: review-1.yaml
    - id: clean1
      run: |
        grep -qx 'verdict: clean' "$TASK_DIR/review-1.yaml"
      continue-on-error: true
    - if: '{{ ne .Steps.clean1.ExitCode 0 }}'
      ask: |
        You look after this pull request:
        https://github.com/{{ .Inputs.repo_owner }}/{{ .Inputs.repo_name }}/pull/{{ file "pr" }}
        "{{ .Inputs.pr_title }}". Its branch is checked out.

        A reviewer looked at its change and found these problems:

        <findings>
        {{ file "review-1.yaml" }}
        </findings>

        Address each one: change it where the reviewer is right, and
        commit. Where the reviewer is wrong, change nothing and say why.
        Commit, never push.
        {{- if eq .Inputs.disclose "true" }}
        Commit messages may say that an agent wrote the change.
        {{- else }}
        Do not say anywhere — commit messages or files — that an agent or AI
        wrote this, and do not add Co-authored-by or similar trailers.
        {{- end }}
        When you are done, say briefly what you changed and what you did not, and why.
    - if: '{{ ne .Steps.clean1.ExitCode 0 }}'
      uses: push
    # The next push is leased against the head this one pushed.
    - if: '{{ ne .Steps.clean1.ExitCode 0 }}'
      run: &lease |
        head="$(sed -n 's/.*"head":"\([^"]*\)".*/\1/p' "$TASK_DIR/push.json")"
        test -n "${head}" && printf '%s' "${head}" > "$TASK_DIR/lease"

    # ── Round 2: only after round 1 found something ───────────────────
    - if: '{{ ne .Steps.clean1.ExitCode 0 }}'
      ask: *review
      session: review-2
    - if: '{{ ne .Steps.clean1.ExitCode 0 }}'
      ask: |
        A reviewer before you found these, and the author says they
        addressed them; check that they did, as part of your review:

        <earlier_findings>
        {{ file "review-1.yaml" }}
        </earlier_findings>

        Now write your findings to the file {{ output "review-2.yaml" }}, in
        the same structure: `verdict: changes` or `verdict: clean`, then
        `findings:` (`[]` if none), each with path, line (optional),
        problem and fix. Only what must change; nothing else in the file.
        Then say in a line that it is written.
      session: review-2
      expects: review-2.yaml
    - id: clean2
      if: '{{ ne .Steps.clean1.ExitCode 0 }}'
      run: |
        grep -qx 'verdict: clean' "$TASK_DIR/review-2.yaml"
      continue-on-error: true
    - if: '{{ ne .Steps.clean2.ExitCode 0 }}'
      ask: |
        The reviewer looked again, at the change as it is now, and found:

        <findings>
        {{ file "review-2.yaml" }}
        </findings>

        Address each one as before: change and commit where right, say why
        not where wrong. Commit, never push. When you are done, say briefly
        what you changed and what you did not, and why.
    - if: '{{ ne .Steps.clean2.ExitCode 0 }}'
      uses: push
    - if: '{{ ne .Steps.clean2.ExitCode 0 }}'
      run: *lease

    # ── Round 3: only after round 2 found something ───────────────────
    - if: '{{ ne .Steps.clean2.ExitCode 0 }}'
      ask: *review
      session: review-3
    - if: '{{ ne .Steps.clean2.ExitCode 0 }}'
      ask: |
        Reviewers before you found these, and the author says they
        addressed them; check that they did, as part of your review:

        <earlier_findings>
        {{ file "review-2.yaml" }}
        </earlier_findings>

        Now write your findings to the file {{ output "review-3.yaml" }}, in
        the same structure: `verdict: changes` or `verdict: clean`, then
        `findings:` (`[]` if none), each with path, line (optional),
        problem and fix. Only what must change; nothing else in the file.
        Then say in a line that it is written.
      session: review-3
      expects: review-3.yaml
    - id: clean3
      if: '{{ ne .Steps.clean2.ExitCode 0 }}'
      run: |
        grep -qx 'verdict: clean' "$TASK_DIR/review-3.yaml"
      continue-on-error: true
    - if: '{{ ne .Steps.clean3.ExitCode 0 }}'
      ask: |
        The reviewer looked a third time and found:

        <findings>
        {{ file "review-3.yaml" }}
        </findings>

        Address each one as before. This is the last round: what is left
        goes to the pull request's own review. Commit, never push. When you
        are done, say briefly what you changed and what you did not, and why.
    - if: '{{ ne .Steps.clean3.ExitCode 0 }}'
      uses: push
