# factory recipe review --url <PR> [--instruction …] [--apply]: a code
# review of a PR. The task's result is a Review task output, which
# `factory apply` (or --apply) posts as the member's pending review on the
# PR, at the commit reviewed: the draft is GitHub's, where it is read,
# changed and submitted.
#
# The PR's text and code are anyone's, and the session runs with nobody
# approving its tools, so the GitHub token reaches the clone and nothing
# else (credentials: clone): the agent has no credentials, and nothing in
# the sandbox holds one. The clone fetches the PR's head and base, so the
# agent reviews with git alone.
#
# After the task, a member can keep talking to the agent in its session
# (Continue session); Update review rewrites the review from that
# conversation.
name: review
on: [pr]
credentials: clone

inputs:
  instructions:
    type: instructions
    description: Review instructions or guidelines the agent must follow

context: |
  You are an expert software engineer reviewing a GitHub pull request.
  Your review is a draft: the member who asked for it reads it, changes
  it and submits it themselves.

  You must not change anything: do NOT modify or create files in the
  repository, do NOT run git write operations (commit, branch, push), and
  do NOT post anything to GitHub. You have no GitHub credentials.

  The PR is checked out in the current directory, detached at its head.
  `refs/factory/pr/base` is its base branch: `git diff
  refs/factory/pr/base...HEAD` is the PR's change, as GitHub shows it.

start:
  steps:
    - uses: clone
    - uses: configure-engine

    - ask: |
        Review this pull request. Do not write the review yet.

        <pr_url>{{ .Inputs.pr_url }}</pr_url>
        <pr_title>{{ .Inputs.pr_title }}</pr_title>
        <pr_body>
        {{ .Inputs.pr_body }}
        </pr_body>

        1. See what changed: `git diff --stat refs/factory/pr/base...HEAD`,
           then `git diff refs/factory/pr/base...HEAD -- <file>` for each
           file, and `git log refs/factory/pr/base..HEAD` for the commits.
        2. Read the surrounding code, the callers and the tests of what
           changed: the whole repository is checked out.
        3. Look for bugs, regressions, missing edge cases, security and
           performance problems the change introduces. Skip generated files
           (zz_generated*, *.pb.go, anything marked "Code generated by").
        {{ with .Inputs.instructions }}
        Review instructions you MUST follow:
        <instructions>
        {{ . }}
        </instructions>
        {{ end }}
        Summarise what you found in a few lines.

    - ask: &write |
        Now write the review. Respond with EXACTLY the following YAML
        structure and nothing else — no prose before or after, no markdown
        fences:

        review:
          body: |
            A short overall summary that points at what most needs fixing.
            No verdict, no praise.
          comments:
            - path: pkg/foo/bar.go    # a file of the diff, as git names it
              line: 42                # a line of the diff: see below
              side: RIGHT             # RIGHT: the new file; LEFT: the old
              severity: HIGH          # LOW, MEDIUM, HIGH or CRITICAL
              body: |
                What is wrong and what to do about it.

        Rules:
        - `line` is a line number in the file on that `side`, and must be
          inside a hunk of `git diff refs/factory/pr/base...HEAD`: an added
          or unchanged line for RIGHT (numbered in the new file), a removed
          line for LEFT (numbered in the old file). Comments elsewhere are
          moved into the body.
        - For a comment on several lines add `start_line` (and
          `start_side`), within the same hunk.
        - Comment only on what needs changing or is wrong; no "looks good".
          No comments at all is a fine answer for a clean change.
        - Severity: LOW is style and naming; MEDIUM missing edge cases and
          maintainability; HIGH bugs, security and data loss, to fix before
          merging; CRITICAL breaks users or production.
        - Quote symbols and paths with backticks.
      capture: review.yaml

revise:
  - id: review
    label: Update review
    steps:
      - ask: |
          The review is to be rewritten to reflect our conversation: keep
          what we did not dispute, change what we did, drop what we agreed
          is wrong. Say in a few lines what changes; do not write it yet.
      # In the format of the first time.
      - ask: *write
        capture: review.yaml

outputs:
  - review.yaml

task-output:
  kind: Review
  from: review.yaml
  preview: spec.body
  actions:
    - verb: edit
      field: spec
      format: yaml
    - verb: post-review
      label: Post as pending review
    - verb: reject
