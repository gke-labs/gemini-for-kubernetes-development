# factory recipe fix --url <issue> [--with-plan true] [--instruction …] [--apply]:
# a fix for an issue, in the issue's sandbox (design/fix-recipe.md). The
# agent commits and never pushes; the push step ends the task, pushing the
# branch to the member's fork and nowhere else. The task's result is a
# Change task output, whose open-pr (`factory apply`, or --apply) opens
# the branch as a draft PR, with the caller's token.
#
# With --with-plan true the first ask follows the approved plan at
# /workspaces/plan-issue-<n>.md, where a plan task (and `factory apply
# --action run:fix`) leaves it.
#
# The revises (factory recipe revise <sandbox> <revise>) are the PR's
# follow-ups, asked into the fix's session: iterate, address-comments,
# fix-ci, rebase. Each ends with the same push, to the branch the start
# pushed, leased against the head last pushed, so the PR follows. Their
# Change carries the replies and report post-replies posts on the PR.
name: fix
on: [issue]
task-type: fix

inputs:
  with_plan:
    description: '"true" to follow the approved plan at /workspaces/plan-issue-<n>.md'
  labels:
    description: Labels for the PR, comma-separated; open-pr adds them
  instructions:
    type: instructions
    description: Additional instructions the agent must follow
  instruction:
    description: What the iterate revise changes, which it asks for (factory recipe revise … iterate --input instruction=…)
    revise: true
  pr_url:
    description: The fix's PR; factory sets it for the revises, from the sandbox's PR alias
    revise: true

context: |
  You are an automated coding agent. You fix GitHub issues; your commits
  become a pull request that a human maintainer reviews.

  You commit, and that is all you write. Do NOT run `git push`, do NOT
  open, edit or comment on pull requests or issues, and do NOT add labels:
  when you are done, factory pushes your commits to the member's fork and
  opens the pull request from what you write.

  The repository is checked out in the current directory, on a new branch
  from the latest default branch. The git remote "origin" is the member's
  fork, "upstream" the repository. `gh` is authenticated, to read issues
  and pull requests. Do not run `git config --global`: in this environment
  it overwrites /dev/null and breaks git for the rest of the run.

start:
  steps:
    - uses: setup-git
    - uses: setup-fork
    - run: sleep 5 # lib.sh's HACK: avoid git lock issues
    - uses: checkout-default-branch
    # The branch the push step pushes, and the upstream commit it starts
    # from.
    - run: |
        git checkout -B "issue-${INPUT_ISSUE_NUMBER}-$(date +%s)"
        git symbolic-ref --short HEAD > "$TASK_DIR/branch"
        git rev-parse HEAD > "$TASK_DIR/base"
    - uses: configure-engine
    # The approved plan, with --with-plan true.
    - run: |
        : > "$TASK_DIR/plan.md"
        case "${INPUT_WITH_PLAN}" in
          true)
            plan="/workspaces/plan-issue-${INPUT_ISSUE_NUMBER}.md"
            test -s "$plan" || { echo "with_plan: there is no plan at $plan" >&2; exit 1; }
            cp "$plan" "$TASK_DIR/plan.md"
            ;;
          "" | false) ;;
          *) echo "with_plan is \"true\" or \"false\", not \"${INPUT_WITH_PLAN}\"" >&2; exit 1 ;;
        esac

    - ask: |
        Fix this GitHub issue, and commit the fix.

        <issue_url>{{ .Inputs.issue_url }}</issue_url>
        <issue_number>{{ .Inputs.issue_number }}</issue_number>
        <issue_title>{{ .Inputs.issue_title }}</issue_title>
        <issue_description>
        {{ .Inputs.issue_body }}
        </issue_description>
        {{ with file "plan.md" }}
        A maintainer reviewed and approved this implementation plan. Follow
        it. Where the code shows a step to be wrong, deviate, and say where
        and why in your summary.
        <approved_plan>
        {{ . }}
        </approved_plan>
        {{ end }}
        {{- with .Inputs.instructions }}
        Additional instructions you MUST follow:
        <instructions>
        {{ . }}
        </instructions>
        {{ end }}
        1. Read the issue and its comments: `gh issue view {{ .Inputs.issue_number }} --comments`.
           Where it references other issues or PRs, read those too
           (`gh issue view <n>`, `gh pr view <n>`): there are often
           important details there, and patterns to follow.
        2. Make the change, and test it.
        3. Commit it.

        Good PR hygiene:
        * Only solve the specific issue. Do not make unrelated changes or
          cleanups. A good PR implements one idea.
        * Keep the commit history clean: structure your commits well,
          separating changes to different modules or generated code into
          separate commits. No excessive, tiny or transient commits: use
          `git commit --amend` or `git commit --fixup` for minor fixes to
          earlier work, and prefer rebasing to merging.
        * If you end up with many commits (more than 10) or hundreds of
          files touched, stop and ask yourself whether the history is
          clean; squash or rebase if it is not.
        * Do not commit large binary files or build artifacts. Clean up
          what builds and tests leave behind (`make clean` if there is one)
          before committing.
        * In each commit body, add a line like "Issue: {{ .Inputs.issue_number }}", but not as
          the first line.
        {{- if eq .Inputs.disclose "true" }}
        * Commit messages may say that an agent wrote the change.
        {{- else }}
        * Do not say anywhere — commit messages or files — that an agent or
          AI wrote this, and do not add Co-authored-by or similar trailers.
        {{- end }}
        * The year is 2026. Copyright headers on new files use 2026.
        * Remember: commit, never push.

        If you get stuck, commit what you have and say so: the pull request
        will be marked work in progress, and people on GitHub may have
        suggestions.

        When you are done, summarise the design decisions you made: the
        rationale behind your changes, and the alternatives you
        considered. This summary is for the human reviewer.

    - ask: |
        Now write the pull request's title and description. Respond with
        EXACTLY the following YAML structure and nothing else — no prose
        before or after, no markdown fences:

        change:
          title: "A brief title, like a commit subject, in double quotes"
          body: |
            A brief description of what the change does and why, for the
            reviewer.

            Fixes #{{ .Inputs.issue_number }}

        Rules:
        - The body MUST contain a line of exactly the form
          `Fixes #{{ .Inputs.issue_number }}`, on its own line, with nothing between `Fixes`
          and the number. Always `Fixes`: "resolves Issue #{{ .Inputs.issue_number }}" or a bare
          "#{{ .Inputs.issue_number }}" does not close the issue when the PR merges.
        - If you could not finish, start the title with "[WIP]" and say in
          the body what is left.
        {{- if eq .Inputs.disclose "true" }}
        - The body states that this pull request was generated by an AI
          coding agent.
        {{- else }}
        - Do not say anywhere that an agent or AI wrote this.
        {{- end }}
      capture: change.yaml

    - uses: push

# The PR's follow-ups. factory hands each one the push the fix last made
# (INPUT_PUSHED_*: fork, branch, base, head) and the PR (pr_url); a
# revise's Change keeps the previous title and body unless the agent
# writes new ones.
revise:
  - id: iterate
    label: Iterate
    inputs: [instruction]
    steps:
      # The branch to push and the head to lease against: a commit someone
      # else pushed to the PR since is never overwritten.
      - run: &pushed |
          test -n "${INPUT_PUSHED_BRANCH}" && test -n "${INPUT_PUSHED_HEAD}" || { echo "the fix pushed nothing; there is no branch to revise" >&2; exit 1; }
          printf '%s\n' "${INPUT_PUSHED_BRANCH}" > "$TASK_DIR/branch"
          printf '%s\n' "${INPUT_PUSHED_BASE}" > "$TASK_DIR/base"
          printf '%s' "${INPUT_PUSHED_HEAD}" > "$TASK_DIR/lease"
          printf '%s' "${INPUT_PR_URL##*/}" > "$TASK_DIR/pr"
          if [ "$(git symbolic-ref --short -q HEAD)" != "${INPUT_PUSHED_BRANCH}" ]; then
            git checkout "${INPUT_PUSHED_BRANCH}"
          fi
      - run: |
          test -n "${INPUT_INSTRUCTION}" || { echo "iterate needs --input instruction=…" >&2; exit 1; }
      - ask: |
          Change the fix as this instruction asks, and commit the change.

          <instruction>
          {{ .Inputs.instruction }}
          </instruction>

          The same rules as before: commit, never push; keep the history
          clean (`git commit --fixup` and an autosquash rebase for small
          fixes to earlier commits are fine: factory pushes with a lease).
          If the instruction needs no change, say so and commit nothing.
          When you are done, say briefly what you changed.
      - ask: &change |
          Now write the result. Respond with EXACTLY the following YAML
          structure and nothing else — no prose before or after, no
          markdown fences:

          change: {}

          or, if the pull request's title or description no longer fit the
          change, with new ones in it:

          change:
            title: "A brief title, like a commit subject, in double quotes"
            body: |
              The whole new description; it keeps the line
              `Fixes #{{ .Inputs.issue_number }}`.
        capture: change.yaml
      - uses: push

  - id: address-comments
    label: Address comments
    steps:
      - run: *pushed
      - run: &needs-pr |
          test -s "$TASK_DIR/pr" || { echo "the fix has no PR yet: open it first (factory apply --action open-pr)" >&2; exit 1; }
      - ask: |
          The pull request for your fix is
          https://github.com/{{ .Inputs.repo_owner }}/{{ .Inputs.repo_name }}/pull/{{ file "pr" }}.
          Reviewers have commented on it. Address their comments.

          1. Read what was said since you last pushed
             ({{ file "lease" }}): the review comments on the code,
             `gh api repos/{{ .Inputs.repo_owner }}/{{ .Inputs.repo_name }}/pulls/{{ file "pr" }}/comments --paginate`,
             the conversation,
             `gh api repos/{{ .Inputs.repo_owner }}/{{ .Inputs.repo_name }}/issues/{{ file "pr" }}/comments --paginate`,
             and the reviews, `gh pr view {{ file "pr" }} --comments`.
             Skip what is already answered, and what bots wrote.
          2. Change what they ask for, where it is right to, and commit.
             Where it is not, do not change it: say why in your reply.
          3. Commit, never push; do NOT reply on GitHub yourself: factory
             posts the replies you write next.
      - ask: |
          Now write your replies. Respond with EXACTLY the following YAML
          structure and nothing else — no prose before or after, no
          markdown fences:

          change:
            replies:
              - inReplyTo: 123456789
                body: |
                  Your answer to that comment: what you changed, or why not.
            report: |
              Optional: one comment for the PR as a whole, such as an
              answer to a review's summary.

          Rules:
          - inReplyTo is the numeric `id` of the comment you answer, from
            the `gh api` output above: a review comment's or a
            conversation comment's. One reply per comment you answer.
          - Add `title:` and `body:` (the whole new description, keeping
            `Fixes #{{ .Inputs.issue_number }}`) only if the pull request's no longer fit.
          {{- if eq .Inputs.disclose "true" }}
          - Each reply and the report says it was written by an AI coding agent.
          {{- else }}
          - Do not say anywhere that an agent or AI wrote this.
          {{- end }}
        capture: change.yaml
      - uses: push

  - id: fix-ci
    label: Fix CI
    steps:
      - run: *pushed
      - run: *needs-pr
      - ask: |
          Checks fail on the pull request for your fix,
          https://github.com/{{ .Inputs.repo_owner }}/{{ .Inputs.repo_name }}/pull/{{ file "pr" }}.
          Fix them.

          1. Find the failed checks: `gh pr checks {{ file "pr" }}`.
          2. Read the failed runs' logs: `gh run view <run-id> --log-failed`.
          3. Find the cause. If your change caused it, fix it and commit.
             If it did not (a flaky test, an outage, a failure on the
             default branch too), change nothing and say so.
          4. Commit, never push; do NOT comment on GitHub yourself.
      - ask: |
          Now write your report. Respond with EXACTLY the following YAML
          structure and nothing else — no prose before or after, no
          markdown fences:

          change:
            report: |
              For the PR's reviewers: which checks failed, why, and what you
              changed, or why the failure is not this change's.

          Add `title:` and `body:` (the whole new description, keeping
          `Fixes #{{ .Inputs.issue_number }}`) only if the pull request's no longer fit.
          {{- if eq .Inputs.disclose "true" }}
          The report says it was written by an AI coding agent.
          {{- else }}
          Do not say anywhere that an agent or AI wrote this.
          {{- end }}
        capture: change.yaml
      - uses: push

  - id: rebase
    label: Rebase
    steps:
      - run: *pushed
      # The new base: the repository's default branch as it is now. The
      # push step force-pushes the rewritten branch, still leased.
      - run: |
          git fetch upstream HEAD
          git rev-parse FETCH_HEAD | tr -d '\n' > "$TASK_DIR/base"
      - ask: |
          Rebase your branch onto {{ file "base" }}, the default branch
          as it is now (`git rebase {{ file "base" }}`). Resolve any
          conflicts so that the change still does what it did; build and
          test what the conflicts touched. Do not push.
          When you are done, say briefly what conflicted and how you
          resolved it.
      - ask: *change
        capture: change.yaml
      - uses: push

outputs:
  - change.yaml

task-output:
  kind: Change
  from: change.yaml
  actions:
    - verb: edit
      field: spec
      format: yaml
    - verb: open-pr
      label: Open draft PR
    - verb: post-replies
      label: Post replies
    - verb: reject
