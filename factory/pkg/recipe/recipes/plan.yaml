# factory recipe plan --url <issue> [--feedback …] [--instruction …] [--apply]:
# an implementation plan for an issue, in the issue's sandbox. The plan is
# the task's result: a Plan task output, which `factory apply` (or
# --apply) posts on the issue, and whose run: fix starts the fix recipe
# with it as fix's plan input (from: Plan). It is also left at
# /workspaces/plan-issue-<n>.md, for the next plan run to revise.
#
# Run again, it revises the issue's plan comment (else the plan it finds
# there), against the comments since and --feedback if given, and the
# comment apply updates that one comment to the next version (comment key
# plan): overseer/plan applied again (the plan watch rule) is the next
# version. The agent writes the plan to a file of its task, so after a
# conversation in its session (Continue session) it rewrites the plan
# when asked, and the task's result follows (taskoutput.Refresh).
#
# Work too big for one PR gets a Breakdown: a `yaml graph` block of steps,
# one PR each. overseer/implement on such a plan starts an issue graph
# instead of a fix (the implement-graph watch rule,
# design/issue-graph-plans.md); a revision keeps the steps' ids, which
# name their sub-issues. Revising the plan of a running graph (a replan:
# overseer/plan again, or a checkpoint's), it reads the graph's status
# comment and the finished sub-issues and their PRs, and keeps the steps
# that are done or active as they are.
name: plan
on: [issue]
as: coder
task-type: plan

inputs:
  feedback:
    description: Maintainer feedback to revise the previous plan against
  instructions:
    type: instructions
    description: Additional planning instructions the agent must follow

context: |
  You are a senior engineer preparing an implementation plan for a GitHub
  issue. A human maintainer will review, refine, and approve this plan
  before any code is written; a later fix run will follow the approved
  plan.

  You must not change anything: do NOT modify or create files in the
  repository (the result file you are asked to write is outside it), do
  NOT run git write operations (commit, branch, push), and do NOT post
  anything to GitHub (no comments, labels, or assignments).

  The repository is already cloned in the current directory.

start:
  steps:
    - uses: setup-git
    - uses: setup-repo
    - run: sleep 5 # lib.sh's HACK: avoid git lock issues
    - uses: checkout-default-branch
    - uses: configure-engine
    # The plan to revise rather than start over: the issue's plan comment
    # (the one comment of key plan, task-output below), by a pool bot or a
    # maintainer - anyone else's carrying the marker is not the plan - else
    # the one a previous run left in the sandbox.
    - uses: keyed-comment
      with:
        key: plan
        authors: pool, owner, member, collaborator
        to: prior-plan.md
        optional: "true"
    - run: test -s "$TASK_DIR/prior-plan.md" || cp "/workspaces/plan-issue-${INPUT_ISSUE_NUMBER}.md" "$TASK_DIR/prior-plan.md" 2>/dev/null || true
    # The graph's status, when the plan's Breakdown is running as an issue
    # graph: the comment of key graph-status the graph controller keeps on
    # the issue (the watcher, a pool login), each step's state and
    # sub-issue. None is a plan with no graph yet.
    - uses: keyed-comment
      with:
        key: graph-status
        authors: pool
        to: graph-status.md
        optional: "true"

    - ask: |
        Investigate this issue. Do not write the plan yet.

        <issue_url>{{ .Inputs.issue_url }}</issue_url>
        <issue_number>{{ .Inputs.issue_number }}</issue_number>
        <issue_title>{{ .Inputs.issue_title }}</issue_title>
        <issue_body>
        {{ .Inputs.issue_body }}
        </issue_body>

        1. Read the issue and its comments: `gh issue view {{ .Inputs.issue_number }} --comments`.
        2. Explore the relevant parts of the codebase: find the files,
           functions, and tests the change would touch. Ground every step of
           your plan in the actual code, not in guesses.
        3. Where the issue references other issues or PRs, read those too:
           `gh issue view <n>` / `gh pr view <n>`.
        {{ with file "prior-plan.md" }}
        A previous version of your plan exists (the issue's "**Implementation
        plan**" comment, which every run updates). The issue's comments
        posted after that comment was last updated are feedback on it.
        Revise it: keep what the feedback does not dispute, change what it
        does, and do not silently drop plan sections.
        <previous_plan>
        {{ . }}
        </previous_plan>
        {{ end }}
        {{- with file "graph-status.md" }}
        The previous plan's Breakdown is running as an issue graph: each of
        its steps is a sub-issue of this issue, opened when the steps before
        it were done. Its status, kept by the graph controller:
        <graph_status>
        {{ . }}
        </graph_status>
        For each step that is done (Succeeded or Skipped), read its
        sub-issue and what came of it: `gh issue view <n> --comments` (a
        Skipped one says why, often that nothing should change), and the
        pull request that closed it - `gh issue view <n> --json
        closedByPullRequestsReferences`, then `gh pr view <pr>` for its
        description and `gh pr diff <pr>` where it matters. What those
        steps taught - a different design, a new step needed, a step no
        longer needed - is what this revision is for. Active steps are in
        progress: read their sub-issues, but they run on as they are.
        {{ end }}
        {{- with .Inputs.feedback }}
        The maintainer's feedback:
        <feedback>
        {{ . }}
        </feedback>
        {{ end }}
        {{- with .Inputs.instructions }}
        Additional planning instructions you MUST follow:
        <instructions>
        {{ . }}
        </instructions>
        {{ end }}
        Summarise what you found in a few lines.

    - ask: |
        Now write the plan to the file {{ output "plan-output.md" }}, as
        markdown, with no top-level title heading, in exactly these sections:

        ## Summary
        2-3 sentences: what the issue asks for and the shape of the change -
        one pull request, or several (how many, and why split).

        ## Questions
        Only if the plan depends on answers only a maintainer can give - a
        product or policy choice, an access, a cost trade-off - and the code
        and the issue cannot settle it; otherwise leave this section out.
        Questions are asked where the answer is needed: a question whose
        answer shapes this plan goes here, on this issue; a question only
        one step needs goes in that step's own body (Breakdown, below). Never
        make a step whose only job is to ask. Write each question exactly
        like this, the recommended option first:

        <!-- factory:question id=retention -->
        **How long are archived task folders kept?**
        - [ ] 180 days, then deleted (recommended: bounds the cost, the retro reads recent weeks)
        - [ ] Kept indefinitely
        - [ ] Moved to coldline after 90 days
        - [ ] Other: answered in a comment

        A maintainer answers by ticking one box, or by ticking Other and
        replying. While any question here is open, leave the Breakdown out
        and write the PR plan with the recommended options, saying so: the
        plan is not ready to implement until it is answered.

        ## Baseline
        What the default branch already has that this builds on, as a table:
        | Area | Files | What exists today |. A few rows; for a small change,
        one or two.

        ## Approach
        The chosen approach and why, including alternatives you rejected and
        the reason. Name the actual packages/files involved. When the change
        spans several components, add a mermaid diagram (a flowchart of how
        they depend on each other, or a sequence diagram of how they
        interact) where it says more than prose.

        ## PR plan
        For one pull request: a numbered list of concrete implementation
        steps, each naming the files it touches, small enough that a
        reviewer can veto one step without invalidating the rest.

        For several (the work is too big for one pull request a reviewer can
        take in - several independent pieces, or a sequence where each piece
        should land and be reviewed before the next; most plans are one PR):
        each pull request is one vertical slice that works and is verified
        on its own, with no unused code waiting for a later PR. Write:

        ### Dependency graph
        A mermaid flowchart (`flowchart LR`) from `main` to every PR: one
        node per Breakdown step, labelled with its id and a short title, an
        edge for each `after`, steps with no `after` coming from `main`.
        Mark a `then: plan` step "(planned first)" and a `then: ask` step
        "(asks first)".

        ### PRs
        A table, in the Breakdown's order:
        | Step | Title | What it adds | Files | After | Verification |
        - What it adds: the capability, end to end, in a sentence or two.
        - Files: the files and packages it touches.
        - Verification: how a reviewer checks it works - the test or the
          command, and what it shows.

        The graph and the table must say exactly what the Breakdown says:
        the same step ids, titles and after edges.

        ## Risks
        What could go wrong: behavior changes, migration concerns, blast
        radius.

        ## Test plan
        How the change will be verified: which tests to add or update, and any
        manual verification worth doing.

        ## Breakdown
        Only for several pull requests; otherwise leave this section out
        entirely. It is the overseer's spec - people read the PR plan - so
        fold it, exactly like this (the blank lines matter for GitHub):

        <details>
        <summary>Breakdown: the steps the overseer runs (an issue graph)</summary>

        ```yaml graph
        maxActive: 1         # how many steps may be open at once
        steps:
          - id: api          # lowercase letters, digits and dashes; unique
            title: Add the Foo API
            body: |
              What this step changes and how to verify it, in full: the
              files, the approach, the tests.
          - id: controller
            title: Reconcile Foo
            after: [api]     # steps that must be done before this starts
            body: |
              ...
            checkpoint: replan  # optional: stop, replan, or [stop, replan]
        finally:             # optional: once every step is done
          title: Document Foo
          body: |
            ...
        ```

        </details>

        Each step becomes a sub-issue, and its pull request is fixed from
        the step's body alone, so a body must stand on its own: what to
        change, in which files, and how to verify it (the PR table's row,
        in full). A step may set `then: plan` (its sub-issue is planned
        first, for a piece still too big or unclear) instead of the default,
        fix. A step that needs a maintainer's answer before it can be done -
        how big it really is (fix or plan first), whether it is needed at
        all, or a choice only it depends on - sets `then: ask`: its body
        holds the step's work as usual, then a `## Questions` section in the
        format above (for size, options like "Fix it as one PR" / "Plan it
        first"; for necessity, "Do it" / "Skip it"). Its sub-issue waits for
        the answer on that same issue, and the agent that then takes it
        reads the answer there. Never add a separate step that only asks;
        never make a step depend on another issue's answer. Do not name
        assignees: the sub-issue goes to the maintainer who approved the
        plan. `checkpoint: stop` pauses the graph
        when the step is done, for a maintainer to look; `replan` has this
        plan revised then. Do not use the id `finally`.
        {{ if file "prior-plan.md" }}
        ## Changes since the previous version
        A short bullet list of what changed from the previous plan and why
        (whose feedback), so a reader sees what moved.

        A question in the previous plan is answered when one of its boxes is
        ticked, or a maintainer answered it in a comment since: fold each
        answer into the plan (approach, PR plan, Breakdown), drop it from
        `## Questions`, and list it here as "<question>: <answer> (@who)".
        Keep the questions still open; once none are, write the Breakdown.

        If the previous plan had a Breakdown, keep each step's id when you
        keep the step - the id names its sub-issue, which may already be
        open or done: do not rename, reorder into new ids, or drop a step
        that is done.
        {{ end }}
        {{- if file "graph-status.md" }}
        The graph is running. Steps its status shows done or active have
        happened: keep each of them in the Breakdown exactly as it is (id,
        title, body, after, then). Only the steps not yet started may
        change, be added or be removed, with their after edges, then,
        checkpoints and finally. Say in "Changes since the previous
        version" what the finished steps showed that made you change the
        rest.
        {{ end }}

        Write the whole file with your file tool (if it refuses the path, with
        the shell), replacing anything in it. Whenever later in this
        conversation you are asked to change the plan or to save it, write
        that file again, whole, in the same sections. Then say in a line or
        two that it is written and what it proposes.
      expects: plan-output.md

    # The next plan run revises the plan it finds there: a link, so a plan
    # rewritten later in the conversation is the one it finds.
    - run: |
        test -s "$TASK_DIR/plan-output.md" || { echo "the plan is empty: the agent wrote no $TASK_DIR/plan-output.md" >&2; exit 1; }
        ln -sfn "$TASK_DIR/plan-output.md" "/workspaces/plan-issue-${INPUT_ISSUE_NUMBER}.md"

outputs:
  - plan-output.md

task-output:
  kind: Plan
  from: plan-output.md
  # One plan comment per issue: the first run posts it, every later run
  # updates it (v2, v3...), so the issue shows one plan, changed in place.
  comment:
    key: plan
  # What can be done with the result: whoever shows it builds its controls
  # from these (factory apply --action does the writes and the fix).
  actions:
    - verb: edit
      field: spec.markdown
      format: markdown
    - verb: comment
      label: Post plan
    - verb: run
      run: fix
      label: Fix with this plan
    - verb: reject
