# factory recipe plan --url <issue> [--feedback …] [--instruction …] [--apply]:
# an implementation plan for an issue, in the issue's sandbox. The plan is
# left at /workspaces/plan-issue-<n>.md, where `factory fix --with-plan`
# follows it, and is the task's result: a Plan task output, which
# `factory apply` (or --apply) posts on the issue.
#
# Run again, it revises the plan it finds there, against --feedback if
# given. After a conversation in its session, `factory recipe revise
# <issue> plan` rewrites the plan from that conversation.
name: plan
on: [issue]
task-type: plan

inputs:
  feedback:
    description: Maintainer feedback to revise the previous plan against
  instructions:
    type: instructions
    description: Additional planning instructions the agent must follow

context: |
  You are a senior engineer preparing an implementation plan for a GitHub
  issue. A human maintainer will review, refine, and approve this plan
  before any code is written; a later fix run will follow the approved
  plan.

  You must not change anything: do NOT modify or create files in the
  repository, do NOT run git write operations (commit, branch, push), and
  do NOT post anything to GitHub (no comments, labels, or assignments).

  The repository is already cloned in the current directory.

start:
  steps:
    - uses: setup-git
    - uses: setup-repo
    - run: sleep 5 # lib.sh's HACK: avoid git lock issues
    - uses: checkout-default-branch
    - uses: configure-engine
    # The plan a previous run left, revised rather than started over.
    - run: cp "/workspaces/plan-issue-${INPUT_ISSUE_NUMBER}.md" "$TASK_DIR/prior-plan.md" 2>/dev/null || touch "$TASK_DIR/prior-plan.md"

    - ask: |
        Investigate this issue. Do not write the plan yet.

        <issue_url>{{ .Inputs.issue_url }}</issue_url>
        <issue_number>{{ .Inputs.issue_number }}</issue_number>
        <issue_title>{{ .Inputs.issue_title }}</issue_title>
        <issue_body>
        {{ .Inputs.issue_body }}
        </issue_body>

        1. Read the issue and its comments: `gh issue view {{ .Inputs.issue_number }} --comments`.
        2. Explore the relevant parts of the codebase: find the files,
           functions, and tests the change would touch. Ground every step of
           your plan in the actual code, not in guesses.
        3. Where the issue references other issues or PRs, read those too:
           `gh issue view <n>` / `gh pr view <n>`.
        {{ with file "prior-plan.md" }}
        A previous version of your plan exists. Revise it: keep what the
        feedback does not dispute, change what it does, and do not silently
        drop plan sections.
        <previous_plan>
        {{ . }}
        </previous_plan>
        {{ end }}
        {{- with .Inputs.feedback }}
        The maintainer's feedback:
        <feedback>
        {{ . }}
        </feedback>
        {{ end }}
        {{- with .Inputs.instructions }}
        Additional planning instructions you MUST follow:
        <instructions>
        {{ . }}
        </instructions>
        {{ end }}
        Summarise what you found in a few lines.

    - ask: |
        Now write the plan. Respond with ONLY the plan as markdown — no prose
        before or after it, no top-level title heading, no code fences around
        the whole plan. Use exactly these sections:

        ## Summary
        2-3 sentences: what the issue asks for and the shape of the fix.

        ## Approach
        The chosen approach and why, including alternatives you rejected and
        the reason. Name the actual packages/files involved.

        ## Steps
        A numbered list of concrete implementation steps. Each step names the
        files it touches. Keep steps small enough that a reviewer can veto one
        step without invalidating the rest.

        ## Risks
        What could go wrong: behavior changes, migration concerns, blast
        radius.

        ## Test plan
        How the change will be verified: which tests to add or update, and any
        manual verification worth doing.
      capture: plan-output.md

    # Where a fix (factory fix --with-plan), the board and a continued chat
    # read the plan, without a fence around all of it.
    - run: &save |
        test -s "$TASK_DIR/plan-output.md" || { echo "the plan is empty" >&2; exit 1; }
        sed -e '1{/^```/d;}' -e '${/^```$/d;}' "$TASK_DIR/plan-output.md" > "/workspaces/plan-issue-${INPUT_ISSUE_NUMBER}.md"

# After the task, a member can keep talking to the agent in its session
# (Continue session). Update plan rewrites the plan from that conversation,
# into the same session, as a new task with its own result.
revise:
  - id: plan
    label: Update plan
    steps:
      - ask: |
          Rewrite the plan to reflect our conversation. Respond with ONLY the
          plan as markdown — no prose before or after it, no top-level title
          heading, no code fences around the whole plan — with the same
          sections as before: Summary, Approach, Steps, Risks, Test plan.
        capture: plan-output.md
      - run: *save

outputs:
  - plan-output.md

task-output:
  kind: Plan
  from: plan-output.md
  # What can be done with the result: whoever shows it builds its controls
  # from these (factory apply --action does the writes and the fix).
  actions:
    - verb: edit
      field: spec.markdown
      format: markdown
    - verb: comment
      label: Post plan
    - verb: run
      run: fix
      label: Fix with this plan
    - verb: reject
