# factory run plan|deploy|teardown --url <repo> --name <run>: one phase of
# a run, in the run's own sandbox (runbook-<repo>-<run>). A run owns its
# directory, docs-exploration/agent-runs/<run>/, on the research/runs
# branch of the member's fork (or, for a repository they cannot fork, of
# the sandbox's checkout alone: local-only): runbook.md, the procedure;
# the scripts generated from it; the receipts, its results.
#
#   plan      the agent writes (or revises) runbook.md and generates the
#             scripts from it, and writes a PLANNED receipt; nothing
#             executes. From a runbook (--runbook), the runbook is copied
#             in first and the plan makes it this run's. With a target
#             (--target), the pull request's head is pinned and laid over
#             the worktree, and deploy and teardown use the pin.
#   deploy    the agent executes the approved plan, repairing the scripts
#             as it goes, and once, at the end, brings runbook.md in line
#             with them.
#   teardown  the agent removes what the run created.
#
# The deterministic parts are run.sh's (pkg/tasks): runbook-prepare (the
# fork or local-only, the runs branch, the target, the runbook copy) and
# runbook-finish (one commit of everything the phase left, pushed, and
# result.json). `factory run` renders the phase's prompt (run_*.txt). The
# agent's shell gets the member's GCP project and region and the run's
# resource prefix, which the plan resolves params.env from.
name: runbook
label: Run
on: [repo]
task-type: run

inputs:
  phase:
    description: plan, deploy or teardown
    required: true
  run:
    description: The run's identity and directory, e.g. deploy-gke-k8s1
    required: true
  prompt:
    description: The phase's prompt, which factory run renders
    required: true
  runbook:
    description: The runbook a plan starts from (plan only)
  target_pr:
    description: The pull request a plan deploys instead of the default branch (plan only)
  resource_prefix:
    description: What the run may name and own in the cloud
  gcp_project:
    description: The member's GCP project, if they configured one
  gcp_region:
    description: The member's GCP region, if they configured one

agent-env:
  RUN_NAME: "{{ .Inputs.run }}"
  RUN_RESOURCE_PREFIX: "{{ .Inputs.resource_prefix }}"
  GOOGLE_CLOUD_PROJECT: "{{ .Inputs.gcp_project }}"
  CLOUDSDK_CORE_PROJECT: "{{ .Inputs.gcp_project }}"
  CLOUDSDK_COMPUTE_REGION: "{{ .Inputs.gcp_region }}"

start:
  steps:
    - uses: setup-git
    - uses: setup-repo
    - uses: configure-engine
    - uses: runbook-prepare
    - ask: |
        {{ .Inputs.prompt }}
    - uses: runbook-finish
