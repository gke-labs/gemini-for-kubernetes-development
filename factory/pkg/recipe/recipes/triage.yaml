# factory recipe triage --url <issue> [--instruction …] [--apply]: labels,
# priority, duplicates and an assessment for an issue. The task's result
# is a Triage task output (task-output.yaml), which `factory apply`
# publishes, or `--apply` once the task is done.
name: triage
on: [issue]
as: coder

inputs:
  instructions:
    type: instructions
    description: Additional triage instructions the agent must follow

context: |
  You are a triage assistant preparing suggestions for a repository
  maintainer about a GitHub issue.

  You must not change anything: do NOT modify or create files (but the
  result file you are asked to write), do NOT run git write operations
  (commit, branch, push), and do NOT post anything to GitHub (no comments,
  labels, or assignments).

  The repository is already cloned in the current directory.

start:
  steps:
    - uses: setup-git
    - uses: setup-repo
    - run: sleep 5 # lib.sh's HACK: avoid git lock issues
    - uses: checkout-default-branch
    - uses: configure-engine

    - ask: |
        Investigate this issue. Do not write the triage yet.

        <issue_url>{{ .Inputs.issue_url }}</issue_url>
        <issue_number>{{ .Inputs.issue_number }}</issue_number>
        <issue_title>{{ .Inputs.issue_title }}</issue_title>
        <issue_body>
        {{ .Inputs.issue_body }}
        </issue_body>

        1. Read the issue and its comments: `gh issue view {{ .Inputs.issue_number }} --comments`.
        2. List the repository's existing labels: `gh label list --limit 100`.
        3. Search for likely duplicates among open issues, for example:
           `gh issue list --search "<key terms from the issue>" --state open --limit 10`.
        4. Skim the relevant parts of the codebase to judge scope, the likely
           cause or affected area, and the difficulty of a fix.
        {{ with .Inputs.instructions }}
        Additional triage instructions you MUST follow:
        <instructions>
        {{ . }}
        </instructions>
        {{ end }}
        Summarise what you found in a few lines.

    - ask: |
        Now write the triage to the file {{ output "triage-output.yaml" }},
        as YAML in EXACTLY this structure, with nothing else in the file:

        triage:
          labels: []        # suggested labels, only from the repo's existing labels
          priority: ""      # low | medium | high
          duplicates: []    # issue numbers that look like duplicates, if any
          assessment: ""    # 2-4 sentences: what the issue is, the likely cause or
                            # affected area, and a suggested next step

        Write the whole file with your file tool (if it refuses the path, with
        the shell), replacing anything in it. Whenever later in this
        conversation you are asked to change the triage or to save it, write
        that file again, whole, in this structure. Then say in a line or two
        that it is written.
      expects: triage-output.yaml

outputs:
  - triage-output.yaml

task-output:
  kind: Triage
  from: triage-output.yaml
  preview: spec.assessment
  # What can be done with the result: whoever shows it builds its controls
  # from these (factory apply --action does the writes).
  actions:
    - verb: edit
      field: spec
      format: yaml
    - verb: label
      label: Add labels
    - verb: comment
      label: Post assessment
    - verb: reject
