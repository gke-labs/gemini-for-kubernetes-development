# factory agent create --url <repo|issue> --agent <definition>: a
# custom agent (.agents/<name>.md) runs as this recipe, in the agent's own
# sandbox. `factory agent create` reads the definition, writes the prompt
# (the definition's, and the issue's title, description and trusted
# comments) and picks the mode:
#
#   chore     the default: the agent works on agent/<slug> from the latest
#             default branch (or on the branch already there, rebased) and
#             commits; the push step pushes it to the member's fork, and
#             the Change's open-pr opens the PR, or finds the one open.
#   none      skipPR: the agent works on the default branch, and nothing is
#             committed or pushed (a chore that only labels or comments).
#   workflow  a workflow's journal: the branch factory-<issue> (or factory),
#             rebased on the default branch; factory commits what the agent
#             leaves and force-pushes it to origin, or deletes the branch
#             once the workflow's issue is closed.
#
# There is no PR mode: changing a PR as an instruction asks is the
# care-iterate recipe's.
#
# A precondition script, when the definition has one, runs first in the
# checkout; when it fails nothing else runs (the agent is deferred).
#
# The agent keeps the token gh holds (credentials: full): chores comment,
# label and open issues themselves.
name: agent
label: Agent
on: [repo, issue]
task-type: agent

inputs:
  prompt:
    description: What the agent is asked, the definition's prompt and its GitHub context
    required: true
  agent_name:
    description: The agent's name, from its definition
    required: true
  agent_file:
    description: The definition's path in the repository
  mode:
    description: chore, none or workflow
    default: chore
  session_id:
    description: The workflow's session (issue-<n>), which names its branch
  precondition:
    description: A script that must pass for the agent to run
  labels:
    description: Labels for a chore's PR, comma-separated

context: |
  You are an automated agent working on a GitHub repository. The
  repository is checked out in the current directory. The git remote
  "origin" is the member's fork, "upstream" the repository. Do not run
  `git push`: factory pushes what has to be pushed. Do not run `git config
  --global`: in this environment it overwrites /dev/null and breaks git
  for the rest of the run.

  Rules you must always follow:
  1. Respect stop labels: NEVER remove, delete or modify `overseer/stop` (or
     any `*/stop`) labels on any pull request or issue. A stop label means
     automated processing was paused; leave stopped items untouched.
  2. NEVER add, remove or change assignees on pull requests or issues.

start:
  steps:
    - run: |
        case "${INPUT_MODE}" in chore|none|workflow) ;; *) echo "mode ${INPUT_MODE} is not chore, none or workflow" >&2; exit 1 ;; esac
    - uses: setup-git
    - uses: setup-fork
    - run: sleep 5 # lib.sh's HACK: avoid git lock issues
    - uses: configure-engine

    - id: precondition
      if: '{{ ne .Inputs.precondition "" }}'
      continue-on-error: true
      run: |
        printf '%s\n' "${INPUT_PRECONDITION}" > "$TASK_DIR/precondition"
        chmod +x "$TASK_DIR/precondition"
        if ! "$TASK_DIR/precondition"; then
          echo "The precondition failed; the agent is deferred."
          exit 1
        fi

    # The branch, by mode. chore records what the push step pushes:
    # the branch, the commit it starts from, and the head to lease against.
    - if: '{{ and (eq .Steps.precondition.ExitCode 0) (or (eq .Inputs.mode "chore") (eq .Inputs.mode "none")) }}'
      uses: checkout-default-branch
    - if: '{{ and (eq .Steps.precondition.ExitCode 0) (eq .Inputs.mode "chore") }}'
      run: |
        slug="$(printf '%s' "${INPUT_AGENT_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c '[:alnum:]' '-' | sed 's/^-*//;s/-*$//')"
        branch="agent/${slug}"
        base="$(git rev-parse HEAD)"
        printf '%s\n' "${branch}" > "$TASK_DIR/branch"
        printf '%s\n' "${base}" > "$TASK_DIR/base"
        login="$(gh api user --jq .login)"
        open="$(gh pr list --state open --head "${branch}" --json number,headRepositoryOwner --jq "map(select(.headRepositoryOwner.login == \"${login}\")) | .[0].number // empty")"
        if git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null; then
          # Pushed by an earlier run: the push leases against it.
          git rev-parse "refs/remotes/origin/${branch}" | tr -d '\n' > "$TASK_DIR/lease"
        fi
        if [ -n "${open}" ]; then
          # Its PR (#${open}) is open: the agent goes on from it, kept up
          # to date with the default branch.
          git checkout -B "${branch}" "refs/remotes/origin/${branch}"
          if ! git rebase "${base}"; then
            echo "Warning: rebasing ${branch} onto the default branch failed; continuing from where it was." >&2
            git rebase --abort || true
          fi
        else
          # No open PR: a closed one's commits do not come back.
          git checkout -B "${branch}"
        fi
    - if: '{{ and (eq .Steps.precondition.ExitCode 0) (eq .Inputs.mode "workflow") }}'
      run: |
        branch="factory"
        case "${INPUT_SESSION_ID}" in issue-*) branch="factory-${INPUT_SESSION_ID#issue-}" ;; esac
        printf '%s\n' "${branch}" > "$TASK_DIR/branch"
        src=upstream
        git remote get-url upstream >/dev/null 2>&1 || src=origin
        default="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
        git fetch "${src}" "${default}"
        if git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null; then
          git checkout -B "${branch}" "refs/remotes/origin/${branch}"
        elif git show-ref --verify --quiet "refs/heads/${branch}"; then
          git checkout "${branch}"
        else
          git checkout -B "${branch}" "${src}/${default}"
        fi
        if ! git rebase "${src}/${default}"; then
          echo "Warning: rebasing ${branch} onto ${src}/${default} failed; continuing from where it was." >&2
          git rebase --abort || true
        fi

    - if: '{{ eq .Steps.precondition.ExitCode 0 }}'
      ask: |
        {{ .Inputs.prompt }}

        ---
        {{- if eq .Inputs.mode "chore" }}
        Commit your changes, with clean commits whose messages say what
        changed and start with "chore: ". Never push: factory pushes your
        commits and opens or updates the pull request. If nothing needs
        changing, commit nothing.
        {{- else if eq .Inputs.mode "workflow" }}
        Do not commit: factory commits what you leave in the checkout (the
        workflow's state and journal) and pushes it.
        {{- else }}
        Do not commit, push or open a pull request: changes to the checkout
        are not kept.
        {{- end }}
        {{- if eq .Inputs.disclose "true" }}
        What you write may say that an agent wrote it.
        {{- else }}
        Do not say anywhere — commit messages, comments or files — that an
        agent or AI wrote this, and do not add Co-authored-by or similar
        trailers.
        {{- end }}
        When you are done, say briefly what you did.

    # chore: what the agent left uncommitted is committed, rather than
    # lost; then whether there is anything to push.
    - id: changed
      if: '{{ and (eq .Steps.precondition.ExitCode 0) (eq .Inputs.mode "chore") }}'
      continue-on-error: true
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -m "chore: automatic updates from agent ${INPUT_AGENT_NAME}"
        fi
        head="$(git rev-parse HEAD)"
        if [ "${head}" = "$(cat "$TASK_DIR/base")" ] || [ "${head}" = "$(cat "$TASK_DIR/lease" 2>/dev/null)" ]; then
          echo "No changes to push."
          exit 1
        fi
    - if: '{{ and (eq .Steps.precondition.ExitCode 0) (eq .Inputs.mode "chore") (eq .Steps.changed.ExitCode 0) }}'
      run: |
        # The Change is factory's, never an agent's: the PR is titled
        # after the agent and lists its commits.
        python3 - <<'PY'
        import json, os, subprocess
        name, path = os.environ["INPUT_AGENT_NAME"], os.environ.get("INPUT_AGENT_FILE", "")
        log = subprocess.run(["git", "log", "--format=- %s", open(os.path.join(os.environ["TASK_DIR"], "base")).read().strip() + "..HEAD"], capture_output=True, text=True).stdout
        body = "This Pull Request was generated by the **%s** agent" % name
        if path:
            body += " ([%s](https://github.com/%s/%s/blob/HEAD/%s))" % (path, os.environ["INPUT_REPO_OWNER"], os.environ["INPUT_REPO_NAME"], path)
        body += ".\n\n### Changes\n" + log
        change = {"title": "chore: " + name, "body": body, "draft": False,
                  "labels": [l for l in os.environ.get("INPUT_LABELS", "").split(",") if l]}
        with open(os.path.join(os.environ["TASK_DIR"], "change.yaml"), "w") as f:
            json.dump({"change": change}, f)  # JSON is YAML
        PY
    - if: '{{ and (eq .Steps.precondition.ExitCode 0) (eq .Inputs.mode "chore") (eq .Steps.changed.ExitCode 0) }}'
      uses: push

    # workflow: the journal goes to origin as it is, or, once the
    # workflow's issue is closed, its branch goes away.
    - if: '{{ and (eq .Steps.precondition.ExitCode 0) (eq .Inputs.mode "workflow") }}'
      run: |
        branch="$(cat "$TASK_DIR/branch")"
        case "${INPUT_SESSION_ID}" in issue-*)
          if [ "$(gh issue view "${INPUT_SESSION_ID#issue-}" --json state --jq .state 2>/dev/null || echo OPEN)" = "CLOSED" ]; then
            echo "Issue #${INPUT_SESSION_ID#issue-} is closed; deleting ${branch}."
            git push origin --delete "${branch}" || true
            exit 0
          fi ;;
        esac
        if [ -z "$(git status --porcelain)" ]; then
          echo "No workflow changes to commit."
          exit 0
        fi
        git add -A
        git commit -m "chore(workflow): update workflow state/journal [skip ci]"
        git -c core.hooksPath=/dev/null push --force origin "${branch}"

outputs:
  - change.yaml

task-output:
  kind: Change
  from: change.yaml
  optional: true
  preview: spec.title
  actions:
    - verb: edit
      field: spec
      format: yaml
    - verb: open-pr
      label: Open PR
    - verb: reject
