# Mirrors issues/scan.go adoptCreatedIssues: an open issue the watcher's
# own login opened (a workflow's or a chore's), without the trigger label
# or a pool assignee, is adopted: labelled with the trigger and assigned
# to the target assignee, so the fix rule picks it up.
#
# Not captured: "without a pool assignee" is a negation of the assignee
# predicate the closed set does not have (assignee is pool, none or
# owner); the labels.none guard is the half it can say.
name: adopt-issue
description: Adopt an issue the watcher opened
on: issue
when:
  opened-by: watcher
  labels: {none: ["{{trigger}}"]}
run:
  label: ["{{trigger}}"]
  assign: "{{assignee}}"
as: watcher
