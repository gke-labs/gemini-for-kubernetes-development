# Mirrors issues/scanner.go queueTask (with queueTasks): an open issue the
# overseer is pointed at (as for fix: labelled, assigned to the pool, or
# opened by the watcher) whose body names a workflow (an .agents/
# definition with mode: workflow) takes the workflow's next step, as
# `factory agent create --agent <definition> --session-id issue-<n>` (the
# dispatcher's agent-chore, dispatcher/cli_runner.go BuildArgs), which
# runs the workflow recipe. There is no updated-since gate: a workflow
# steps every cooldown while the issue is open. The success cooldown is
# the workflow definition's own (10m when it sets none).
name: workflow
description: Take a workflow's next step on the issue that names it
on: issue
order: 10
when:
  fanout-held: false
  workflow: any
run:
  recipe: workflow
as: agent
policy:
  dedupe: item
  cooldown: {success: "{{workflow-cooldown}}", failure: 20m}
  phase: 4
expect: [open]
