# Mirrors prs/handlers.go handlePRReview, gated by prs/labels.go
# shouldAutoReviewPR and isPRApprovedOrLGTM: a green PR with no unresolved
# feedback, not approved, labelled */review (on itself or an issue it
# closes), whose head the automated reviewer has not reviewed, is reviewed
# and the review submitted (review --apply --action submit-review,
# api/recipe.go), once per head. Fourth in the pr-care group
# (prs/scanner.go evaluate).
#
# Not captured: */review on a closing issue rather than the PR is a fact
# of another item (inherit-labels usually copies it first); the review
# instructions are the overseer's, passed by the engine.
name: review
description: Review a green PR labelled for review
on: pr
group: {name: pr-care, order: 40}
when:
  labels: {all: ["*/review"]}
  checks: green
  approved: false
  reviewed-at-head: false
run:
  recipe: review
  apply: submit-review
as: reviewer
policy:
  dedupe: head
  phase: 1
expect: [open, head]
