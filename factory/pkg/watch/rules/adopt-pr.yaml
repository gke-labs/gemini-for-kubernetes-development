# Mirrors prs/adoption.go adoptOrphanedBotPRs / adoptOrphanedBotPR: a PR
# a pool bot authored, without the trigger label or a pool assignee (so no
# listing finds it), that closes an issue with the trigger label, takes
# the labels of the issues it closes and joins the overseer's PRs.
#
# Off: a safety net for PRs opened without their labels (a watch killed
# mid-task on the classic path); open-pr labels the PR it opens, and the
# overseer-kcc logs show no adoption since 2026-10-16. Kept, to turn on
# again if orphans show up; it may fold into inherit-labels.
name: adopt-pr
description: Adopt a bot's PR whose issue is the overseer's
on: pr
enabled: false
when:
  author: pool
  assignee: not-pool
  labels: {none: ["{{trigger}}"]}
  closes: {labels: {any: ["{{trigger}}"]}}
run:
  label: ["{{closing-issue-labels}}"]
