# Mirrors prs/handlers.go handlePRInvestigate: a PR whose checks fail is
# investigated and fixed by its author (care-ci --apply --action
# post-replies, api/recipe.go). It runs again on a new head, after a
# failed run, on a PR assigned to the pool explicitly, or 2h after the
# last. After 3 attempts since the last commit, trusted human comment or
# pause it gives up with the stop label (investigationAttempts). Third of
# the PR rules that take the item (prs/scanner.go evaluate).
name: ci
description: Investigate and fix failing checks
on: pr
order: 30
when:
  author: pool
  checks: failing
run:
  recipe: care-ci
  apply: post-replies
policy:
  cooldown:
    success: 2h
    reset-on: [head]
    skip-when: {assignee: pool}
  give-up:
    attempts: 3
    since: [head, human, pause]
    comment: Pausing after 3 attempts to fix the failing checks.
  phase: 3
