# Mirrors issues/scanner.go queueTasks (with prs/scanner.go evaluate) and
# the dispatcher's ShouldCancelTask (dispatcher/subcontrollers.go): the
# stop label drops the item's queued tasks, at scan and again at
# dispatch.
#
# Not captured: dropping queued tasks is not an action of the model (run
# is a recipe or GitHub writes); the stop label is a global gate of the
# engine, and this rule only names it. It is here to be listed, and its
# write (the label) is what give-up's then: stop adds.
name: stop
description: The stop label drops an item's queued tasks
on: issue
enabled: false
when:
  labels: {any: ["*/stop"]}
run:
  stop: {}
as: watcher
