# Mirrors issues/scanner.go queueTasks (with prs/scanner.go evaluate) and
# the dispatcher's ShouldCancelTask (dispatcher/subcontrollers.go): the
# stop label drops the item's queued tasks, at scan and again at
# dispatch.
#
# Off as a rule: the stop label is a gate of the engine on every rule
# (no rule runs on a stopped item, and its queued tasks drop), not one
# rule among others; this file names it and what it does. Its label is
# what give-up's then: stop adds.
name: stop
description: The stop label drops an item's queued tasks
on: issue
enabled: false
when:
  labels: {any: ["*/stop"]}
run:
  drop: true
