# Mirrors prs/labels.go syncReferencedIssueLabels: a candidate PR takes
# the labels of the issues it closes, all but ready-for-human, every time
# it is evaluated and ahead of the rules that take the item, so they see
# them (review's */review, most often).
name: inherit-labels
description: Copy the closing issues' labels onto the PR
on: pr
order: 5
when:
  author: pool
  labels: {none: ["*/ready-for-human"]}
run:
  label: ["{{closing-issue-labels}}"]
as: watcher
