# Mirrors prs/handlers.go handlePRIterate: a PR that does not merge is
# rebased by its author (care-rebase --apply --action post-replies,
# its run: below), once per head. Second of the PR rules that
# take the item (prs/scanner.go evaluate).
name: conflict
description: Rebase a PR that conflicts with its base
on: pr
order: 20
when:
  author: pool
  mergeable: false
run:
  recipe: care-rebase
  apply: post-replies
  on-start:
    comment: "AI Factory started resolving merge conflicts / rebasing this pull request in a sandbox.\n\nNote: We recommend waiting for the 'ready-for-human' label before leaving review comments. Comments added while the system is actively working may be associated with outdated commits once a new commit is pushed, causing them to be ignored."
policy:
  dedupe: head
  phase: 2
  # Resolving a conflict upstream need not change the PR's updated_at:
  # look at it again every scan.
  revisit: every-scan
