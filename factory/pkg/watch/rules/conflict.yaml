# Mirrors prs/handlers.go handlePRIterate: a PR that does not merge is
# rebased by its author (care-rebase --apply --action post-replies,
# its run: below), once per head. Second of the PR rules that
# take the item (prs/scanner.go evaluate).
name: conflict
description: Rebase a PR that conflicts with its base
on: pr
order: 20
when:
  author: pool
  mergeable: false
run:
  recipe: care-rebase
  apply: post-replies
policy:
  dedupe: head
  phase: 2
  # Resolving a conflict upstream need not change the PR's updated_at:
  # look at it again every scan.
  revisit: every-scan
