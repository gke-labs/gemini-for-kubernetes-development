# Mirrors issues/nudge.go NudgeLinkedWorkflows / nudge: when the sandbox
# GC confirms an issue closed, the workflows on the issues that link it
# take their next step at once, skipping their cooldown.
#
# Not captured: the event comes from the GC plugin, not a listing; the
# cooldown skip is the event's, the model has no field for it.
name: nudge
description: Step a workflow when an issue it links closes
on: event
when:
  event: linked-issue-closed
run:
  recipe: workflow
as: agent
