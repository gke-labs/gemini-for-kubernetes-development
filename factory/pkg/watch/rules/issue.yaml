# The issue rules, in the order the engine walks them (design: watch-rules.md,
# Order). A repository's .agents/rules/<name>.yaml replaces one in place,
# turns one off (name and enabled), or adds one before or after a named rule.
on: issue
rules:
  # Mirrors issues/scanner.go queueTask (with queueTasks): an open issue the
  # overseer is pointed at (as for fix: labelled, assigned to the pool, or
  # opened by the watcher) whose body names a workflow (an .agents/
  # definition with mode: workflow) takes the workflow's next step, as
  # `factory agent create --agent <definition> --session-id issue-<n>` (the
  # dispatcher's agent-chore, dispatcher/cli_runner.go BuildArgs), which
  # runs the workflow recipe. There is no updated-since gate: a workflow
  # steps every cooldown while the issue is open. The success cooldown is
  # the workflow definition's own (10m when it sets none).
  - name: workflow
    description: Take a workflow's next step on the issue that names it
    when:
      fanout: false
      workflow: any
    run:
      recipe: workflow
    policy:
      cooldown: {success: "{{workflow-cooldown}}", failure: 20m}
      phase: 4

  # Mirrors issues/scanner.go queueTask (with queueTasks) and issues/scan.go
  # scanAssigned / adoptCreatedIssues: an open issue the overseer is pointed
  # at - labelled with the trigger, assigned to the pool, or opened by the
  # watcher's own login - not a fan-out's parent, with no closing or
  # linked PR and no workflow named in its body, updated since its last fix
  # ended, is fixed and the PR opened ready (the dispatcher's recipe table,
  # api/recipe.go: fix --apply --action open-pr --pr-labels --input
  # draft=false). The 10m / 20m cooldowns are the scanner's after a success
  # / a failure.
  #
  # An issue without the trigger label gets it when its task is queued
  # (applyTriggerLabel), and the coder the dispatcher picks is assigned when
  # the task starts (the claim, which unassigns the watcher). Adoption wrote
  # the same two things earlier - the label, and the watcher as a parking
  # assignee - so an issue the watcher opened is tracked like a labelled
  # one and is this rule's, rather than a rule of its own.
  - name: fix
    description: Fix an issue the overseer is pointed at and open the PR
    when:
      fanout: false
      linked-pr: none
      workflow: none
    run:
      recipe: fix
      apply: open-pr
      inputs:
        draft: "false"
        labels: "{{pr-labels}}"
    policy:
      dedupe: update
      cooldown: {success: 10m, failure: 20m}
      phase: 3

  # Mirrors issues/scanner.go queueTasks (with prs/scanner.go evaluate) and
  # the dispatcher's ShouldCancelTask (dispatcher/subcontrollers.go): the
  # stop label drops the item's queued tasks, at scan and again at
  # dispatch.
  #
  # Off as a rule: the stop label is a gate of the engine on every rule
  # (no rule runs on a stopped item, and its queued tasks drop), not one
  # rule among others; this file names it and what it does. Its label is
  # what a give-up adds.
  - name: stop
    description: The stop label drops an item's queued tasks
    enabled: false
    when:
      labels: {any: ["*/stop"]}
    run:
      drop: true
