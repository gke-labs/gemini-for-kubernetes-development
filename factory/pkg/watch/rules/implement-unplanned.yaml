# overseer/implement on an issue with no plan comment by a pool bot or a maintainer (plan: none)
# has nothing to implement. The watcher says so and takes the command label
# off, rather than run a task that would fail.
name: implement-unplanned
description: Say that an issue labelled overseer/implement has no plan to implement
on: issue
order: 18
when:
  labels: {any: ["{{trigger}}/implement"]}
  plan: none
run:
  unlabel: ["{{trigger}}/implement"]
  comment: "This issue has no plan to implement: plan it first (the plan label), then apply the implement label."
