name: build and publish images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_name:
          - configdir-cli
          - configdir-controller
          - github-mcp-server
          - repo-sandbox
          - repowatch-controller
          - review-api
          - review-ui
          - syncer
          - generic-golang
          - dind-golang
          - overseer
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image_name == 'overseer' && 'overseer/images/overseer/Dockerfile' || format('repo-agent/images/{0}/Dockerfile', matrix.image_name) }}
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/gke-labs/gemini-for-kubernetes-development/${{ matrix.image_name }}:latest
            ghcr.io/gke-labs/gemini-for-kubernetes-development/${{ matrix.image_name }}:${{ github.sha }}

  deploy-staging:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ secrets.GKE_STAGING_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}

      - name: Deploy to Staging
        run: |
          chmod +x ./dev/tools/deploy-to-kube
          # Deploy repo-agent manifests
          ./dev/tools/deploy-to-kube --image-prefix=ghcr.io/gke-labs/gemini-for-kubernetes-development/ --image-tag=${{ github.sha }} --working-dir repo-agent/ --replace .spec.installationName=${{ secrets.GKE_STAGING_CLUSTER }} --replace .spec.gatewayClassName=gke-l7-regional-external-managed
          # Deploy overseer manifests (RBAC)
          ./dev/tools/deploy-to-kube --image-prefix=ghcr.io/gke-labs/gemini-for-kubernetes-development/ --image-tag=${{ github.sha }} --working-dir overseer/

          # Bounce the pods after installing
          kubectl rollout restart statefulset/repowatch-controller -n repo-agent-system
          kubectl rollout status  statefulset/repowatch-controller -n repo-agent-system
          kubectl rollout restart deployment/pr-review-api deployment/pr-review-ui deployment/syncer deployment/registry -n repo-agent-system
          kubectl rollout status  deployment/pr-review-api -n repo-agent-system
          kubectl rollout status  deployment/pr-review-ui -n repo-agent-system
          kubectl rollout status  deployment/syncer -n repo-agent-system
          kubectl rollout status  deployment/registry -n repo-agent-system
