name: safe upgrade autopush

on:
  workflow_dispatch:
    inputs:
      overseer_input:
        description: 'Overseer input (instance name to upgrade, e.g. overseer)'
        required: true
        default: 'overseer'
        type: string

permissions:
  contents: read

jobs:
  safe-upgrade-autopush:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Google Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ${{ vars.GKE_AUTOPUSH_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Safe Upgrade Overseer Instance
        env:
          OVERSEER_INPUT: ${{ inputs.overseer_input }}
        run: |
          chmod +x ./overseer/scripts/update-overseer-factory.sh
          ./overseer/scripts/update-overseer-factory.sh "$OVERSEER_INPUT" 10800

  safe-upgrade-autopush-std:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Google Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ${{ vars.GKE_AUTOPUSH_STD_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}

      - name: Safe Upgrade Overseer Instance Standard
        env:
          OVERSEER_INPUT: ${{ inputs.overseer_input }}
        run: |
          chmod +x ./overseer/scripts/update-overseer-factory.sh
          ./overseer/scripts/update-overseer-factory.sh "$OVERSEER_INPUT" 10800
