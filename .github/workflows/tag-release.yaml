name: 'Tag Release'

on:
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - repo-agent/version.go

permissions:
  contents: read

jobs:
  tag-release:
    if: ${{ github.repository == 'gke-labs/gemini-for-kubernetes-development' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: /usr/bin/git config --global user.email actions@github.com
      - run: /usr/bin/git config --global user.name 'GitHub Actions Release Tagger'
      - run: dev/release/tag-release --working-dir repo-agent