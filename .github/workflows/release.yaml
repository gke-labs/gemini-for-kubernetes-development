name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_name:
          - configdir-cli
          - configdir-controller
          - github-mcp-server
          - repowatch-controller
          - review-api
          - review-ui
          - syncer
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch all history so we can get the latest tag
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: repo-agent/
          file: repo-agent/images/${{ matrix.image_name }}/Dockerfile
          push: true
          tags: |
            ghcr.io/gke-labs/gemini-for-kubernetes-development/${{ matrix.image_name }}:${{ github.ref_name }}

  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch all history so we can get the latest tag
          fetch-depth: 0

      - name: Generate Release Assets
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          chmod +x ./dev/tools/deploy-to-kube
          mkdir release-assets/
          ./dev/tools/deploy-to-kube --image-prefix=ghcr.io/gke-labs/gemini-for-kubernetes-development/ --image-tag="$IMAGE_TAG" --working-dir repo-agent/ --output-file=release-assets/manifest.yaml
          sed "s/{REPO_AGENT_VERSION:=.*}/{REPO_AGENT_VERSION:=$IMAGE_TAG}/g" repo-agent/installer.sh > release-assets/installer.sh
          chmod +x release-assets/installer.sh

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            release-assets/manifest.yaml \
            release-assets/installer.sh \
            --title "Release $TAG_NAME"
