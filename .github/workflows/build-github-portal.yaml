name: Build and Publish github-portal

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone service-portals repo
        run: |
          git clone https://github.com/gke-labs/service-portals.git service-portals

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./service-portals
          file: ./service-portals/images/service-portal/Dockerfile
          push: true
          tags: ghcr.io/gke-labs/gemini-for-kubernetes-development/github-portal:latest
