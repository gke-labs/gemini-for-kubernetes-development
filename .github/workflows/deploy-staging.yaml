name: deploy to staging

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ secrets.GKE_STAGING_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}

      - name: Deploy to Staging
        run: |
          chmod +x ./repo-agent/scripts/upgrade.sh
          ./repo-agent/scripts/upgrade.sh
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SKIP_PREQS: 'true'
          CLUSTER_NAME: ${{ secrets.GKE_STAGING_CLUSTER }}
          GW_CLASS: 'gke-l7-regional-external-managed'

      - name: Deploy Overseer to Staging
        run: |
          chmod +x ./overseer/scripts/upgrade.sh
          ./overseer/scripts/upgrade.sh
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SKIP_PREQS: 'true'
          CLUSTER_NAME: ${{ secrets.GKE_STAGING_CLUSTER }}
